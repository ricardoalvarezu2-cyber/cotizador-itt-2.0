<title>Cotizador ITT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: mesa de trabajo de cotización — barra superior fija, carátula, pestañas, bloques separados con mucho aire.
   Legibilidad (dislexia, web/DISENO.md): una sola tipografía de alta legibilidad (Atkinson Hyperlegible), 17 px, interlineado 1,6,
   sin mayúsculas sostenidas ni tipografía de máquina, fondo blanco roto y texto gris muy oscuro, alineado a la izquierda. */
:root{
  --bg:#f4f3ee; --panel:#fdfcf9; --ink:#1f2b33; --muted:#46555f; --line:#d8d7ce; --soft:#ecebe4; --zebra:#f7f6f1;
  --accent:#1d5f86; --accent-ink:#ffffff; --accent-soft:#dcebf4;
  --ok:#2c7a4b; --ok-soft:#ddf1e4; --warn:#9a6205; --warn-soft:#fbefd6; --bad:#a3392f; --bad-soft:#f8e1de;
  --azul-itt:#002060;
  --f-disp:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;
  --f-mono:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14191d; --panel:#1b2228; --ink:#e6eaec; --muted:#b0bcc4; --line:#33404a; --soft:#222b33; --zebra:#1f272e;
  --accent:#6cb3de; --accent-ink:#0d1a22; --accent-soft:#1d3546;
  --ok:#73c895; --ok-soft:#183427; --warn:#e5b25a; --warn-soft:#3a2e15; --bad:#ef8b80; --bad-soft:#3d1f1c; --azul-itt:#8fb4ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14191d; --panel:#1b2228; --ink:#e6eaec; --muted:#b0bcc4; --line:#33404a; --soft:#222b33; --zebra:#1f272e;
  --accent:#6cb3de; --accent-ink:#0d1a22; --accent-soft:#1d3546;
  --ok:#73c895; --ok-soft:#183427; --warn:#e5b25a; --warn-soft:#3a2e15; --bad:#ef8b80; --bad-soft:#3d1f1c; --azul-itt:#8fb4ff; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.barra .in,.main{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.barra .in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-block:10px}
.marca{font:800 18px/1 var(--f-disp);font-stretch:80%;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.marca i{display:inline-block;width:10px;height:22px;background:var(--azul-itt);border-radius:1px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none;font-weight:500;padding:6px 10px;border-radius:3px}
nav a[aria-current="page"]{color:var(--ink);background:var(--soft)}
.datos-al{margin-left:auto;font:500 12px var(--f-mono);color:var(--muted)}
.datos-al.viejo{color:var(--bad)}
.main{display:flex;flex-direction:column;gap:22px;padding-block:22px 72px}
h1,h2,h3{font-family:var(--f-disp);font-stretch:85%;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(24px,3.6vw,34px);font-weight:750}
h2{font-size:20px;font-weight:700}
h3{font-size:15.5px;font-weight:650}
p{margin:0;max-width:72ch}
.num,.mono,td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 11.5px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;border-bottom:2px solid var(--ink);padding-bottom:6px}
button,.btn{font:600 13.5px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:3px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.prim{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.peligro{color:var(--bad);border-color:var(--bad)}
button.chico{padding:4px 8px;font-size:12.5px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:6px 8px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical;line-height:1.45}
input[type=number],input.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
:is(input,select,textarea,button,a):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
label>span{font-weight:500}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.campos .ancho{grid-column:1/-1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fila.fin{justify-content:flex-end}
.pill{font:600 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:3px;border:1px solid currentColor;white-space:nowrap;display:inline-block}
.pill.ok{color:var(--ok);background:var(--ok-soft)} .pill.warn{color:var(--warn);background:var(--warn-soft)} .pill.bad{color:var(--bad);background:var(--bad-soft)} .pill.info{color:var(--accent);background:var(--accent-soft)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:600 11px/1.2 var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 8px;border-bottom:1.5px solid var(--line);background:var(--soft);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
td .d{font-weight:500} td .sp{font-size:12px;color:var(--muted)}
td input{padding:4px 6px}
td.ed{width:92px} td.ed input{width:84px}
tr.total td{background:var(--soft);font-weight:600}
/* carátula */
.cab{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:end;border-bottom:3px solid var(--ink);padding-bottom:14px}
.cab .meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.estados{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.estados button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.guardado{font:500 12px var(--f-mono);color:var(--muted);text-align:right}
@media (max-width:700px){.cab{grid-template-columns:1fr}.estados{justify-content:flex-start}.guardado{text-align:left}}
/* totales */
.totales{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);background:var(--panel);border-radius:4px}
.totales>div{padding:12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.totales>div:last-child{border-right:0}
.totales .v{font:500 clamp(18px,2.4vw,26px)/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.totales .s{font-size:12px;color:var(--muted)}
.totales .prim .v{color:var(--accent)}
@media (max-width:760px){.totales{grid-template-columns:repeat(2,minmax(0,1fr))}.totales>div:nth-child(2){border-right:0}.totales>div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
/* pestañas */
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:6px;background:var(--soft);border:1px solid var(--line);border-radius:8px;margin:6px 0 4px}
@media (max-width:640px){.tabs button{font-size:14px;padding:8px 10px;flex:1 1 auto;justify-content:center}}
.tabs button{font:600 15px var(--f-body);border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);padding:10px 16px;display:flex;align-items:center;gap:7px}
.tabs button:hover{border-color:var(--accent);color:var(--accent)}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tabs .paso{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 12px var(--f-body)}
.tabs button[aria-selected="true"] .paso{background:var(--accent-ink);color:var(--accent)}
.tabs .cnt{font:600 11.5px var(--f-mono);background:var(--soft);color:var(--muted);border-radius:10px;padding:1px 7px}
.tabs button[aria-selected="true"] .cnt{background:rgba(255,255,255,.22);color:var(--accent-ink)}
.tabs .cnt.alerta{background:#f8e1de;color:#a3392f}
/* buscador */
.buscador{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.resultado{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:start}
.resultado:last-child{border-bottom:0}
.resultado .precio{font:500 15px var(--f-mono);text-align:right;white-space:nowrap}
.resultado .acc{grid-column:3;display:flex;gap:6px;align-items:center;justify-content:flex-end}
.resultado .acc input{width:74px}
.resultado .det{grid-column:1/-1;font-size:12px;color:var(--muted)}
@media (max-width:620px){.resultado{grid-template-columns:1fr}.resultado .acc,.resultado .precio{grid-column:1;justify-content:flex-start;text-align:left}}
.filtros-items{gap:12px}
.filtros-items label{flex-direction:row;align-items:center;gap:6px}
.filtros-items select{width:auto}
details.avs summary{cursor:pointer;font:600 12px var(--f-mono);white-space:nowrap;list-style:none}
details.avs summary::-webkit-details-marker{display:none}
details.avs.bad summary{color:var(--bad)} details.avs.warn summary{color:var(--warn)}
details.avs ul{margin:6px 0 0;padding-left:16px;font-size:12px;min-width:220px}
.capa .panel.vista{width:min(800px,100%)}
.vista .hoja{background:#fff;color:#1b2730;border:1px solid var(--line);padding:16px;overflow-x:auto;border-radius:3px}
input.mal{border-color:var(--bad);background:var(--bad-soft)}
.bus-gral input{font-size:16px;padding:10px 12px}
.resultado .tilde{flex-direction:row;align-items:center;gap:8px;color:inherit}
.resultado .tilde input{width:18px;height:18px;flex:none}
.resultado.sel{background:var(--accent-soft)}
.barra-sel{position:sticky;top:56px;z-index:3;background:var(--panel);border:1px solid var(--accent);border-radius:4px;padding:8px 10px}
.lista-res{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.aviso{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--panel);padding:12px 14px;border-radius:3px;display:flex;flex-direction:column;gap:6px}
.aviso.bad{border-left-color:var(--bad)} .aviso.ok{border-left-color:var(--ok)}
.aviso ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.vacio{border:1.5px dashed var(--line);border-radius:4px;padding:26px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
#tab{display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
/* rubros: lista de filas desplegables (detallado o global) */
.rb-cuerpo[hidden]{display:none}
.rubros{border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.rb{border-bottom:1px solid var(--line)} .rb:last-child{border-bottom:0}
.rb.global{box-shadow:inset 3px 0 0 var(--accent)}
.rb-cab{display:grid;grid-template-columns:minmax(200px,1.2fr) minmax(0,2fr) 150px auto;gap:10px 16px;align-items:center;padding:10px 14px}
.rb-abrir{border:0;background:none;padding:4px 0;display:flex;align-items:center;gap:8px;text-align:left;white-space:normal;font:inherit;color:var(--ink)}
.rb-abrir b{font:650 15px/1.2 var(--f-disp);font-stretch:85%}
.rb-abrir .flecha{color:var(--muted);width:12px;flex:none}
.rb-datos{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;min-width:0}
.dato{font:400 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap} .dato b{color:var(--ink);font-weight:500}
.rb-monto{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.rb-monto .s{font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rb-monto .v{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.segm{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;justify-self:end}
.segm button{border:0;border-radius:0;padding:5px 10px;font-size:12.5px;background:var(--panel)}
.segm button+button{border-left:1px solid var(--line)}
.segm button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rb-cuerpo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 28px;padding:4px 14px 16px 34px}
.rb-cuerpo h4{margin:0;font:600 11px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rb-ficha,.rb-carga{display:flex;flex-direction:column;gap:10px;min-width:0}
.rb table.ficha{width:100%;border-collapse:collapse;font-size:13.5px} .rb table.ficha td{padding:4px 6px;border-bottom:1px solid var(--line)}
.rb table.ficha td.n{white-space:normal;overflow-wrap:anywhere}
.rb .warn{color:var(--warn)}
.rb-cuerpo.rb-uno{grid-template-columns:1fr}
.rb table.renglones td{vertical-align:middle} .rb table.renglones td:first-child{width:50%;min-width:200px} .rb table.renglones td.ed input{width:90px}
details.panel>summary{cursor:pointer} details.panel[open]>summary{margin-bottom:8px}
@media (max-width:860px){.rb-cab{grid-template-columns:1fr auto}.rb-datos{grid-column:1/-1;order:3}.rb-monto{align-items:flex-start;order:4}.segm{order:2}.rb-cuerpo{grid-template-columns:1fr;padding-left:14px}}
/* calculadoras del modo detallado */
.calc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 28px;align-items:start}
.calc{display:flex;flex-direction:column;gap:10px;min-width:0}
.calc-sold{grid-column:1/-1;padding-bottom:18px;border-bottom:1px solid var(--line)}
.calc-sold td select{min-width:76px;max-width:130px} .calc-sold td:nth-child(6) select{min-width:170px;max-width:220px}
.calc-c+.calc-c{border-left:1px solid var(--line);padding-left:28px}
.calc label{max-width:320px}
.resultado-calc{font-size:14px}
@media (max-width:980px){.calc-grid{grid-template-columns:1fr}.calc-c+.calc-c{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:14px}}
.capa{position:fixed;inset:0;background:rgb(10 20 28 / .45);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.capa .panel{width:min(760px,100%);box-shadow:0 12px 40px rgb(0 0 0 / .25)}
.firma-img{max-height:64px;max-width:200px;background:#fff;border:1px solid var(--line);border-radius:3px;padding:4px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:4px;z-index:30;font-size:13.5px;max-width:min(420px,calc(100vw - 32px))}
.err{color:var(--bad);font-size:12.5px}
nav a[data-cnt]:not([data-cnt=""])::after{content:attr(data-cnt);font:600 10.5px/1 var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:2px 5px;margin-left:5px;vertical-align:1px}
/* chat con Claude: panel lateral; en pantallas anchas corre el contenido, en el celular ocupa toda la pantalla */
.btn-chat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chat{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--panel);border-left:1px solid var(--line);z-index:15;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgb(0 0 0 / .12);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.chat[hidden]{display:none}
@media (min-width:1180px){body.con-chat .barra .in,body.con-chat .main{margin-right:440px;margin-left:max(0px,calc((100vw - 440px - 1240px)/2))}}
.ch-cab{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.ch-cab b{font:750 17px var(--f-disp);font-stretch:85%}
.ch-cab .small{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:1180px){body.con-chat .toast{right:calc(456px + env(safe-area-inset-right,0px))}}
.ch-msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{padding:9px 11px;border-radius:6px;font-size:14px;line-height:1.5;max-width:94%;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent-soft);color:var(--ink)}
.msg.a{align-self:flex-start;background:var(--soft)}
.msg.a ul{margin:4px 0;padding-left:18px}
.msg.pensando{color:var(--muted);font-style:italic}
.msg.prop{border:1px solid var(--accent);background:var(--panel);display:flex;flex-direction:column;gap:6px;width:94%}
.traza{font:500 11.5px/1.35 var(--f-mono);color:var(--muted);padding-left:4px;border-left:2px solid var(--line)}
.ch-pie{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ch-pie textarea{min-height:64px}
/* celular: barra compacta y no fija; lista de cotizaciones como tarjetas */
@media (max-width:700px){
  .barra{position:static}
  .barra .in{gap:6px 10px;padding-block:8px}
  .marca{order:1} .btn-chat{order:2;margin-left:auto}
  nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  nav a{padding:5px 8px;white-space:nowrap}
  .datos-al{order:4;width:100%;margin-left:0;font-size:11px}
  .main{gap:16px;padding-block:14px 56px}
  table.tarjetas thead{display:none}
  table.tarjetas,table.tarjetas tbody,table.tarjetas tr,table.tarjetas td{display:block;width:100%}
  table.tarjetas tr{padding:10px 12px;border-bottom:1px solid var(--line)}
  table.tarjetas td{border:0;padding:2px 0;text-align:left}
  table.tarjetas td[data-l]::before{content:attr(data-l) ": ";color:var(--muted);font:500 12px var(--f-body)}
  table.tarjetas td.n{text-align:left}
}
@media (prefers-reduced-motion:no-preference){button,nav a{transition:background .12s,border-color .12s}}

/* ---- Capa de legibilidad (29-10-2026): pisa los tamaños y estilos de arriba ---- */
body{font-size:17px;line-height:1.6;letter-spacing:.012em;word-spacing:.06em}
html.texto-grande body{font-size:19px}
h1{font-size:clamp(26px,3.4vw,32px);font-weight:700;letter-spacing:0} h2{font-size:22px;font-weight:700} h3{font-size:18px;font-weight:700}
h1,h2,h3{font-stretch:normal;line-height:1.3}
p{max-width:68ch}
.small{font-size:.88em} .muted{color:var(--muted)}
.main{gap:32px;padding-block:28px 80px} #tab{gap:32px} section{gap:16px}
.sec-head{border-bottom:1px solid var(--line);padding-bottom:10px;align-items:center}
.eyebrow{font:400 .88em/1.4 var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted)}
.panel{padding:20px 22px;gap:16px;border-radius:8px}
button,.btn{font:700 .9em var(--f-body);padding:9px 14px;border-radius:6px;letter-spacing:.01em}
button.chico{font-size:.85em;padding:6px 11px}
input,select,textarea{font-size:1em;padding:9px 11px;border-radius:6px}
label{font-size:.9em;gap:6px} label>span{font-weight:700;color:var(--ink)}
.pill{font:700 .78em/1.2 var(--f-body);letter-spacing:0;text-transform:none;padding:3px 10px;border-radius:999px;border:0}
table{font-size:.94em}
th{font:700 .86em/1.3 var(--f-body);letter-spacing:0;text-transform:none;color:var(--ink);padding:11px 10px;background:var(--soft)}
td{padding:11px 10px;vertical-align:middle}
tbody tr:nth-child(even) td{background:var(--zebra)}
td .sp{font-size:.9em;line-height:1.45;color:var(--muted)}
.num,.mono,td.n,input.num,.totales .v,.rb-monto .v,.resultado .precio{font-variant-numeric:tabular-nums lining-nums}
.datos-al{font-size:.8em} .guardado{font-size:.82em}
.totales .v{font:700 clamp(22px,2.6vw,30px)/1.15 var(--f-body)} .totales .s{font-size:.82em} .totales>div{padding:16px 18px;gap:4px}
.tabs .cnt{font:700 .78em var(--f-body);padding:1px 8px}
.tabs button{font-size:1em}
.dato{font:400 .92em var(--f-body);color:var(--muted)} .dato b{font-weight:700}
.rb-monto .s{font:400 .8em/1.2 var(--f-body);letter-spacing:0;text-transform:none}
.rb-monto .v{font:700 1.05em var(--f-body)}
.rb-cuerpo h4{font:700 .95em/1.3 var(--f-body);letter-spacing:0;text-transform:none;color:var(--ink)}
.rb-abrir b{font:700 1.05em/1.3 var(--f-body)}
.rb-cab{padding:14px 16px} .rb-cuerpo{padding:6px 16px 20px 38px;gap:20px 32px}
.traza{font:400 .8em/1.4 var(--f-body)}
.msg.pensando{font-style:normal}
.aviso{padding:14px 16px;border-radius:6px} .aviso ul{font-size:.95em;gap:6px}
nav a{font-size:1em} nav a[data-cnt]:not([data-cnt=""])::after{font:700 .7em/1 var(--f-body)}
.resultado{padding:14px 14px;gap:6px 14px}
.resultado details.det{grid-column:1/-1;font-size:.88em;color:var(--muted)} .resultado details.det summary{cursor:pointer;color:var(--accent);width:max-content}
/* tabla de materiales: un renglón corto por ítem y el detalle desplegable */
.it-abrir{border:0;background:none;padding:2px 6px 2px 0;font:inherit;color:var(--ink);text-align:left;white-space:normal;display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.it-abrir .flecha{color:var(--muted);flex:none;width:12px}
tr.it-det[hidden]{display:none}
table.items tbody tr:nth-child(even) td{background:transparent}
table.items tbody tr:not(.it-det) td{border-top:1px solid var(--line)}
tr.it-det td{background:var(--zebra)!important;padding:4px 10px 18px 46px}
.it-det-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 28px;font-size:.92em}
.it-det-grid b{display:block;font-size:.9em;color:var(--muted);font-weight:700}
@media (max-width:700px){.btn-texto{order:2;margin-left:auto}}
