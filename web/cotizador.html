<title>Cotizador ITT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: mesa de trabajo de cotización — barra superior fija, carátula, pestañas, bloques separados con mucho aire.
   Legibilidad (dislexia, web/DISENO.md): una sola tipografía de alta legibilidad (Atkinson Hyperlegible), 17 px, interlineado 1,6,
   sin mayúsculas sostenidas ni tipografía de máquina, fondo blanco roto y texto gris muy oscuro, alineado a la izquierda. */
:root{
  --bg:#f4f3ee; --panel:#fdfcf9; --ink:#1f2b33; --muted:#46555f; --line:#d8d7ce; --soft:#ecebe4; --zebra:#f7f6f1;
  --accent:#1d5f86; --accent-ink:#ffffff; --accent-soft:#dcebf4;
  --ok:#2c7a4b; --ok-soft:#ddf1e4; --warn:#9a6205; --warn-soft:#fbefd6; --bad:#a3392f; --bad-soft:#f8e1de;
  --azul-itt:#002060;
  --f-disp:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;
  --f-mono:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14191d; --panel:#1b2228; --ink:#e6eaec; --muted:#b0bcc4; --line:#33404a; --soft:#222b33; --zebra:#1f272e;
  --accent:#6cb3de; --accent-ink:#0d1a22; --accent-soft:#1d3546;
  --ok:#73c895; --ok-soft:#183427; --warn:#e5b25a; --warn-soft:#3a2e15; --bad:#ef8b80; --bad-soft:#3d1f1c; --azul-itt:#8fb4ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14191d; --panel:#1b2228; --ink:#e6eaec; --muted:#b0bcc4; --line:#33404a; --soft:#222b33; --zebra:#1f272e;
  --accent:#6cb3de; --accent-ink:#0d1a22; --accent-soft:#1d3546;
  --ok:#73c895; --ok-soft:#183427; --warn:#e5b25a; --warn-soft:#3a2e15; --bad:#ef8b80; --bad-soft:#3d1f1c; --azul-itt:#8fb4ff; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.barra .in,.main{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.barra .in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-block:10px}
.marca{font:800 18px/1 var(--f-disp);font-stretch:80%;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.marca i{display:inline-block;width:10px;height:22px;background:var(--azul-itt);border-radius:1px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none;font-weight:500;padding:6px 10px;border-radius:3px}
nav a[aria-current="page"]{color:var(--ink);background:var(--soft)}
.datos-al{margin-left:auto;font:500 12px var(--f-mono);color:var(--muted)}
.datos-al.viejo{color:var(--bad)}
.main{display:flex;flex-direction:column;gap:22px;padding-block:22px 72px}
h1,h2,h3{font-family:var(--f-disp);font-stretch:85%;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(24px,3.6vw,34px);font-weight:750}
h2{font-size:20px;font-weight:700}
h3{font-size:15.5px;font-weight:650}
p{margin:0;max-width:72ch}
.num,.mono,td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 11.5px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;border-bottom:2px solid var(--ink);padding-bottom:6px}
button,.btn{font:600 13.5px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:3px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.prim{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.peligro{color:var(--bad);border-color:var(--bad)}
button.chico{padding:4px 8px;font-size:12.5px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:6px 8px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical;line-height:1.45}
input[type=number],input.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
:is(input,select,textarea,button,a):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
label>span{font-weight:500}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.campos .ancho{grid-column:1/-1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fila.fin{justify-content:flex-end}
.pill{font:600 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:3px;border:1px solid currentColor;white-space:nowrap;display:inline-block}
.pill.ok{color:var(--ok);background:var(--ok-soft)} .pill.warn{color:var(--warn);background:var(--warn-soft)} .pill.bad{color:var(--bad);background:var(--bad-soft)} .pill.info{color:var(--accent);background:var(--accent-soft)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:600 11px/1.2 var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 8px;border-bottom:1.5px solid var(--line);background:var(--soft);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
td .d{font-weight:500} td .sp{font-size:12px;color:var(--muted)}
td input{padding:4px 6px}
td.ed{width:92px} td.ed input{width:84px}
tr.total td{background:var(--soft);font-weight:600}
/* carátula */
.cab{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:end;border-bottom:3px solid var(--ink);padding-bottom:14px}
.cab .meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.estados{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.estados button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.guardado{font:500 12px var(--f-mono);color:var(--muted);text-align:right}
@media (max-width:700px){.cab{grid-template-columns:1fr}.estados{justify-content:flex-start}.guardado{text-align:left}}
/* totales */
.totales{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);background:var(--panel);border-radius:4px}
.totales>div{padding:12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.totales>div:last-child{border-right:0}
.totales .v{font:500 clamp(18px,2.4vw,26px)/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.totales .s{font-size:12px;color:var(--muted)}
.totales .prim .v{color:var(--accent)}
@media (max-width:760px){.totales{grid-template-columns:repeat(2,minmax(0,1fr))}.totales>div:nth-child(2){border-right:0}.totales>div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
/* pestañas */
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:6px;background:var(--soft);border:1px solid var(--line);border-radius:8px;margin:6px 0 4px}
@media (max-width:640px){.tabs button{font-size:14px;padding:8px 10px;flex:1 1 auto;justify-content:center}}
.tabs button{font:600 15px var(--f-body);border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);padding:10px 16px;display:flex;align-items:center;gap:7px}
.tabs button:hover{border-color:var(--accent);color:var(--accent)}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tabs .paso{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 12px var(--f-body)}
.tabs button[aria-selected="true"] .paso{background:var(--accent-ink);color:var(--accent)}
.tabs .cnt{font:600 11.5px var(--f-mono);background:var(--soft);color:var(--muted);border-radius:10px;padding:1px 7px}
.tabs button[aria-selected="true"] .cnt{background:rgba(255,255,255,.22);color:var(--accent-ink)}
.tabs .cnt.alerta{background:#f8e1de;color:#a3392f}
/* buscador */
.buscador{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.resultado{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:start}
.resultado:last-child{border-bottom:0}
.resultado .precio{font:500 15px var(--f-mono);text-align:right;white-space:nowrap}
.resultado .acc{grid-column:3;display:flex;gap:6px;align-items:center;justify-content:flex-end}
.resultado .acc input{width:74px}
.resultado .det{grid-column:1/-1;font-size:12px;color:var(--muted)}
@media (max-width:620px){.resultado{grid-template-columns:1fr}.resultado .acc,.resultado .precio{grid-column:1;justify-content:flex-start;text-align:left}}
.filtros-items{gap:12px}
.filtros-items label{flex-direction:row;align-items:center;gap:6px}
.filtros-items select{width:auto}
details.avs summary{cursor:pointer;font:600 12px var(--f-mono);white-space:nowrap;list-style:none}
details.avs summary::-webkit-details-marker{display:none}
details.avs.bad summary{color:var(--bad)} details.avs.warn summary{color:var(--warn)}
details.avs ul{margin:6px 0 0;padding-left:16px;font-size:12px;min-width:220px}
.capa .panel.vista{width:min(800px,100%)}
.vista .hoja{background:#fff;color:#1b2730;border:1px solid var(--line);padding:16px;overflow-x:auto;border-radius:3px}
input.mal{border-color:var(--bad);background:var(--bad-soft)}
.bus-gral input{font-size:16px;padding:10px 12px}
.resultado .tilde{flex-direction:row;align-items:center;gap:8px;color:inherit}
.resultado .tilde input{width:18px;height:18px;flex:none}
.resultado.sel{background:var(--accent-soft)}
.barra-sel{position:sticky;top:56px;z-index:3;background:var(--panel);border:1px solid var(--accent);border-radius:4px;padding:8px 10px}
.lista-res{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.aviso{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--panel);padding:12px 14px;border-radius:3px;display:flex;flex-direction:column;gap:6px}
.aviso.bad{border-left-color:var(--bad)} .aviso.ok{border-left-color:var(--ok)}
.aviso ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.vacio{border:1.5px dashed var(--line);border-radius:4px;padding:26px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
#tab{display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
/* rubros: lista de filas desplegables (detallado o global) */
.rb-cuerpo[hidden]{display:none}
.rubros{border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.rb{border-bottom:1px solid var(--line)} .rb:last-child{border-bottom:0}
.rb.global{box-shadow:inset 3px 0 0 var(--accent)}
.rb-cab{display:grid;grid-template-columns:minmax(200px,1.2fr) minmax(0,2fr) 150px auto;gap:10px 16px;align-items:center;padding:10px 14px}
.rb-abrir{border:0;background:none;padding:4px 0;display:flex;align-items:center;gap:8px;text-align:left;white-space:normal;font:inherit;color:var(--ink)}
.rb-abrir b{font:650 15px/1.2 var(--f-disp);font-stretch:85%}
.rb-abrir .flecha{color:var(--muted);width:12px;flex:none}
.rb-datos{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;min-width:0}
.dato{font:400 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap} .dato b{color:var(--ink);font-weight:500}
.rb-monto{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.rb-monto .s{font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rb-monto .v{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.segm{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;justify-self:end}
.segm button{border:0;border-radius:0;padding:5px 10px;font-size:12.5px;background:var(--panel)}
.segm button+button{border-left:1px solid var(--line)}
.segm button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rb-cuerpo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 28px;padding:4px 14px 16px 34px}
.rb-cuerpo h4{margin:0;font:600 11px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rb-ficha,.rb-carga{display:flex;flex-direction:column;gap:10px;min-width:0}
.rb table.ficha{width:100%;border-collapse:collapse;font-size:13.5px} .rb table.ficha td{padding:4px 6px;border-bottom:1px solid var(--line)}
.rb table.ficha td.n{white-space:normal;overflow-wrap:anywhere}
.rb .warn{color:var(--warn)}
.rb-cuerpo.rb-uno{grid-template-columns:1fr}
.rb table.renglones td{vertical-align:middle} .rb table.renglones td:first-child{width:55%;min-width:220px} .rb table.renglones td.ed input{width:90px}
details.panel>summary{cursor:pointer} details.panel[open]>summary{margin-bottom:8px}
@media (max-width:860px){.rb-cab{grid-template-columns:1fr auto}.rb-datos{grid-column:1/-1;order:3}.rb-monto{align-items:flex-start;order:4}.segm{order:2}.rb-cuerpo{grid-template-columns:1fr;padding-left:14px}}
/* calculadoras del modo detallado */
.calc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 28px;align-items:start}
.calc{display:flex;flex-direction:column;gap:10px;min-width:0}
.calc-sold{grid-column:1/-1;padding-bottom:18px;border-bottom:1px solid var(--line)}
.calc-sold td select{min-width:76px;max-width:130px} .calc-sold td:nth-child(6) select{min-width:170px;max-width:220px}
.calc-c+.calc-c{border-left:1px solid var(--line);padding-left:28px}
.calc label{max-width:320px}
.resultado-calc{font-size:14px}
@media (max-width:980px){.calc-grid{grid-template-columns:1fr}.calc-c+.calc-c{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:14px}}
.capa{position:fixed;inset:0;background:rgb(10 20 28 / .45);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.capa .panel{width:min(760px,100%);box-shadow:0 12px 40px rgb(0 0 0 / .25)}
.firma-img{max-height:64px;max-width:200px;background:#fff;border:1px solid var(--line);border-radius:3px;padding:4px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:4px;z-index:30;font-size:13.5px;max-width:min(420px,calc(100vw - 32px))}
.err{color:var(--bad);font-size:12.5px}
nav a[data-cnt]:not([data-cnt=""])::after{content:attr(data-cnt);font:600 10.5px/1 var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:2px 5px;margin-left:5px;vertical-align:1px}
/* chat con Claude: panel lateral; en pantallas anchas corre el contenido, en el celular ocupa toda la pantalla */
.btn-chat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chat{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--panel);border-left:1px solid var(--line);z-index:15;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgb(0 0 0 / .12);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.chat[hidden]{display:none}
@media (min-width:1180px){body.con-chat .barra .in,body.con-chat .main{margin-right:440px;margin-left:max(0px,calc((100vw - 440px - 1240px)/2))}}
.ch-cab{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.ch-cab b{font:750 17px var(--f-disp);font-stretch:85%}
.ch-cab .small{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:1180px){body.con-chat .toast{right:calc(456px + env(safe-area-inset-right,0px))}}
.ch-msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{padding:9px 11px;border-radius:6px;font-size:14px;line-height:1.5;max-width:94%;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent-soft);color:var(--ink)}
.msg.a{align-self:flex-start;background:var(--soft)}
.msg.a ul{margin:4px 0;padding-left:18px}
.msg.pensando{color:var(--muted);font-style:italic}
.msg.prop{border:1px solid var(--accent);background:var(--panel);display:flex;flex-direction:column;gap:6px;width:94%}
.traza{font:500 11.5px/1.35 var(--f-mono);color:var(--muted);padding-left:4px;border-left:2px solid var(--line)}
.ch-pie{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ch-pie textarea{min-height:64px}
/* celular: barra compacta y no fija; lista de cotizaciones como tarjetas */
@media (max-width:700px){
  .barra{position:static}
  .barra .in{gap:6px 10px;padding-block:8px}
  .marca{order:1} .btn-chat{order:2;margin-left:auto} #btn-chat-nuevo{margin-left:0}
  nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  nav a{padding:5px 8px;white-space:nowrap}
  .datos-al{order:4;width:100%;margin-left:0;font-size:11px}
  .main{gap:16px;padding-block:14px 56px}
  table.tarjetas thead{display:none}
  table.tarjetas,table.tarjetas tbody,table.tarjetas tr,table.tarjetas td{display:block;width:100%}
  table.tarjetas tr{padding:10px 12px;border-bottom:1px solid var(--line)}
  table.tarjetas td{border:0;padding:2px 0;text-align:left}
  table.tarjetas td[data-l]::before{content:attr(data-l) ": ";color:var(--muted);font:500 12px var(--f-body)}
  table.tarjetas td.n{text-align:left}
}
@media (prefers-reduced-motion:no-preference){button,nav a{transition:background .12s,border-color .12s}}

/* ---- Capa de legibilidad (29-10-2026): pisa los tamaños y estilos de arriba ---- */
body{font-size:17px;line-height:1.6;letter-spacing:.012em;word-spacing:.06em}
html.texto-grande body{font-size:19px}
h1{font-size:clamp(26px,3.4vw,32px);font-weight:700;letter-spacing:0} h2{font-size:22px;font-weight:700} h3{font-size:18px;font-weight:700}
h1,h2,h3{font-stretch:normal;line-height:1.3}
p{max-width:68ch}
.small{font-size:.88em} .muted{color:var(--muted)}
.main{gap:32px;padding-block:28px 80px} #tab{gap:32px} section{gap:16px}
.sec-head{border-bottom:1px solid var(--line);padding-bottom:10px;align-items:center}
.eyebrow{font:400 .88em/1.4 var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted)}
.panel{padding:20px 22px;gap:16px;border-radius:8px}

<script>
// Motor de cálculo del cotizador: mismas fórmulas que herramientas/armar_cotizacion.py (calcular y factor).
// Se prueba contra Python con web/probar_motor.js (la CAPEX tiene que dar costo 5.456,38 · unitario 7.366,12 · total 14.732,24; 29-10-2026).
const Motor = (() => {
  // idx: [{mes:"2024-01", local, cpi}, ...] ordenado por mes
  function factorAjuste(item, idx, fref, aplicar) {
    if (!aplicar) return 1;
    const col = item.grupo !== "material" ? "local" : "cpi";
    const f = (item.fuentes[0].fecha || "").slice(0, 7);
    let mes = f < fref ? f : fref;            // min(fecha, referencia)
    if (mes < idx[0].mes) mes = idx[0].mes;  // max(…, primer mes de la tabla)
    const en = m => { let v = idx[0]; for (const r of idx) if (r.mes <= m) v = r; return v[col]; };
    return en(fref) / en(mes);
  }

  function redondear(x, d = 2) {
    const k = 10 ** d;
    return Math.round((x + Number.EPSILON) * k) / k;
  }

  // Índices de la cotización: los congelados (al pasar a revisado) o los vigentes de la base
  function indicesDe(cfg, idx) {
    const cg = cfg.indices_congelados;
    return cg && cg.filas && cg.filas.length ? cg.filas : idx;
  }

  const esTaval = it => it.grupo === "material" && !!it.taval;

  function calcular(cfg, idx) {
    idx = indicesDe(cfg, idx);
    const p = cfg.parametros, fref = p.fecha_referencia.slice(0, 7);
    const sub = { material: 0, mo: 0, servicio: 0, taval: 0 }, sub0 = { material: 0, mo: 0, servicio: 0, taval: 0 };
    const ftv = p.FTV ?? 1;  // válvulas Taval (empresa del grupo): factor aparte, por defecto 1
    const filas = cfg.items.map(it => {
      const fa = factorAjuste(it, idx, fref, p.AJ);
      const base = it.cantidad * it.fuentes[0].precio, g = esTaval(it) ? "taval" : it.grupo;
      sub[g] += base * fa;
      sub0[g] += base;
      return { id: it.id, base, factor: fa, ajustado: base * fa };
    });
    const cont = sub.material * p.CONT / 100, tav = sub.taval * (1 + p.CONT / 100);
    const costo = sub.material + cont + tav + sub.mo + sub.servicio;
    const costo0 = (sub0.material + sub0.taval) * (1 + p.CONT / 100) + sub0.mo + sub0.servicio;
    const precio = redondear((sub.material + cont) * p.FM + tav * ftv + (sub.mo + sub.servicio) * p.FMO, 2);
    const flete = p.TRANS ? (p.TR_ARS / p.TC + p.TR_EMB) * p.TR_F : 0;
    return { sub, cont, tav, ftv, costo, costo0, precio_unitario: precio, flete, total: redondear(precio * p.N + flete, 2), filas };
  }

  // Escenarios de factor (el factor lo define la dirección; la herramienta propone 1,35 y muestra alternativas)
  function escenarios(cfg, idx, factores = [1.25, 1.30, 1.35, 1.40, 1.50]) {
    return factores.map(F => {
      const c = calcular({ ...cfg, parametros: { ...cfg.parametros, FM: F, FMO: F } }, idx);
      return { F, unitario: c.precio_unitario, total: c.total, margen: 1 - c.costo / c.precio_unitario };
    });
  }
  return { factorAjuste, calcular, escenarios, redondear, indicesDe, esTaval };
})();
if (typeof module !== "undefined") module.exports = Motor;

// Búsqueda en los catálogos y controles de una cotización. Misma lógica que herramientas/buscar_material.py
// (igual / similar con diferencias) y que herramientas/verificar_computo.py (avisos), pero con filtros elegidos en pantalla.
const Busqueda = (() => {
  const CON_TIPO = ["VAL", "AFO", "ABW", "BRI", "JUN", "INS"];
  const TIPO_FUENTE = { "lista": "lista", "compra": "stock", "stock (precio maestro)": "stock", "cotización": "cot", "planilla interna": "ant", "estimado (cepo)": "est", "estimado (fecha supuesta)": "est" };
  const FRAC = { "½": " 1/2", "¼": " 1/4", "¾": " 3/4", "⅛": " 1/8", "°": " grados ", "º": " grados ", "ø": " diam ", "Ø": " diam " };

  function norm(t) {
    let s = String(t ?? "");
    for (const [a, b] of Object.entries(FRAC)) s = s.split(a).join(b);
    return s.normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
  }

  // Palabras de búsqueda: un número se busca como número entero ("4" no encuentra "3/4" ni "1/4"; "150" no encuentra "1500")
  function coincide(texto) {
    const tokens = norm(texto).split(" ").filter(Boolean).map(t => /^\d+([.,]\d+)?$/.test(t)
      ? new RegExp(`(?<![\\d/.,])${t.replace(/[.,]/, "[.,]")}(?![\\d/.,])`) : t);
    return tokens.length ? s => tokens.every(t => typeof t === "string" ? s.includes(t) : t.test(s)) : null;
  }

  function campos(datos, fam) {
    return (datos.familias[fam].clave.length ? datos.familias[fam].clave : ["tipo"]).filter(c => c !== "marca" && c !== "modelo");
  }

  function opcionales(fam, f) {
    const o = new Set(["diametro2", "trim", "schedule", "cara", "medida", "extremos"]);
    if (fam === "CAN") { o.add("revestimiento"); if (f.schedule) o.add("espesor_mm"); else if (f.espesor_mm) o.add("schedule"); }
    if (fam === "JUN") {
      if (["esparrago", "bulon", "tuerca", "arandela"].includes(f.tipo)) o.add("serie"); else o.add("material");
      if (["esparrago", "bulon"].includes(f.tipo)) o.delete("medida");
    }
    if (fam === "VAL" && !String(f.tipo || "").startsWith("esferica")) o.add("paso");  // el paso solo distingue esféricas
    return o;
  }

  // Valores existentes de un atributo dentro de la familia (para los desplegables), filtrados por lo ya elegido
  function valores(datos, fam, campo, f) {
    const cuenta = new Map();
    for (const r of datos.materiales) {
      if (r.f !== fam) continue;
      if (f.tipo && campo !== "tipo" && r.a.tipo !== f.tipo) continue;
      const v = r.a[campo];
      if (v) cuenta.set(v, (cuenta.get(v) || 0) + 1);
    }
    return [...cuenta.entries()].sort((a, b) => {
      const na = parseFloat(a[0]), nb = parseFloat(b[0]);
      return (!isNaN(na) && !isNaN(nb)) ? na - nb : String(a[0]).localeCompare(String(b[0]));
    });
  }

  // ------------------------------------------------------------------ compatibilidad (espejo de herramientas/compatibilidad.py)
  // igual que indice_proyectos.norm: las fracciones antes de NFKD ("½" no queda "12")
  const FRACCIONES = { "½": " 1/2", "¼": " 1/4", "¾": " 3/4", "⅛": " 1/8", "⅜": " 3/8", "⅝": " 5/8", "⅞": " 7/8", "\u2044": "/", "ø": " diam ", "Ø": " diam ", "⌀": " diam ", "°": " grados ", "º": " grados " };
  const normP = t => Object.entries(FRACCIONES).reduce((s, [a, b]) => s.split(a).join(b), String(t ?? "")).normalize("NFKD").replace(/[^\x00-\x7f]/g, "").toLowerCase().replace(/\s+/g, " ");
  const RX = new WeakMap();
  const mats = C => { if (!RX.has(C)) RX.set(C, C.materiales.map(m => ({ ...m, rx: new RegExp(m.patron) }))); return RX.get(C); };
  // igual que compatibilidad.prep: sin lo negado ("NO AISI 316"), "GR°B" → "gr b", medidas "5/8 x 60" → "5/8 por 60"
  const prep = (C, t) => normP(t).replace(new RegExp(C.negacion, "g"), " ").replace(new RegExp(C.grados, "g"), "$1 ")
    .replace(new RegExp(C.medida_x, "g"), "$1 por ").replace(new RegExp(C.prep, "g"), "a$1");
  function clases(C, texto, preparado = false) {
    const t = preparado ? texto : prep(C, texto), hits = [];
    for (const m of mats(C)) {
      const x = t.match(m.rx); if (!x) continue;
      const a = x.index, b = x.index + x[0].length;
      if (!hits.some(h => h[1] <= a && b <= h[2])) hits.push([m, a, b]);
    }
    const out = new Map();
    for (const [m] of hits) if (!out.has(m.clase)) out.set(m.clase, m.grupo_b16_5);
    if (out.size > 1) for (const g of Object.keys(C.genericos)) out.delete(g);
    return out;
  }
  const grado = t => (normP(t).match(/\b(?:x|wphy|f)[- ]?(\d{2})\b/) || [])[1] || "";
  const limpio = x => normP(x).replace(/[^a-z0-9]/g, "");
  const esInox = c => c.startsWith("inox") || c === "duplex" || c === "superduplex";
  function reemplaza(C, ca, ga, cb, gb, pedido, cand) {
    if (!(cb === ca || (C.reemplaza[ca] || []).includes(cb) || (C.genericos[ca] || []).includes(cb))) return false;
    if (ga && gb && !(C.grupos[ga] || [ga]).includes(gb)) return false;
    if (cb === ca && ca === "carbono_alta_resistencia" && grado(pedido) && grado(cand) && grado(pedido) !== grado(cand)) return false;
    return true;
  }
  // válvulas: clases del cuerpo (compatibilidad.cuerpo); null si nombra carbono e inoxidable sin decir cuál es el cuerpo
  function cuerpo(C, texto) {
    const sinInt = prep(C, texto).replace(new RegExp(C.internos, "g"), " ");
    const expl = (sinInt.match(new RegExp(C.cuerpo, "g")) || []).join(" ");
    const c = new Map([...clases(C, expl || sinInt, true)].filter(([k]) => !C.no_metal.includes(k) && !/^(bulon|tuerca)/.test(k)));
    if ([...c.keys()].some(esInox) && [...c.keys()].some(k => !esInox(k))) return null;
    return c;
  }
  function reglaCuerpo(C, pedido, cand) {
    const pb = cuerpo(C, pedido), cb = cuerpo(C, cand);
    if (pb && !pb.size) return "";
    if (!cb || !cb.size) return `no se sabe el material del cuerpo del candidato (${String(cand).slice(0, 40)}): no se puede comparar`;
    if (!pb) {
      const a = clases(C, pedido);
      for (const [k, g] of cb) if (![...a].some(([ca, ga]) => reemplaza(C, ca, ga, k, g, pedido, cand))) return `cuerpo ${k} del candidato: el pedido no lo nombra`;
      return "";
    }
    for (const [ca, ga] of pb) if (![...cb].some(([k, g]) => reemplaza(C, ca, ga, k, g, pedido, cand))) return `cuerpo del candidato no reemplaza al cuerpo pedido (${ca})`;
    return "";
  }
  function reglaMaterial(C, fam, pedido, cand, descCand) {
    if (!String(pedido || "").trim()) return "";
    const gv = new RegExp(C.galv);
    if (gv.test(normP(pedido)) !== gv.test(normP(`${cand || ""} ${descCand || ""}`))) return "galvanizado y negro no se reemplazan";
    const a = clases(C, pedido);
    let b = String(cand || "").trim() ? clases(C, cand) : new Map();
    if (!b.size) b = clases(C, descCand || "");
    if (!a.size) return limpio(pedido) && limpio(pedido) === limpio(cand) ? "" : `material ${pedido} sin regla: solo vale el mismo material`;
    if (!b.size) return `el candidato no dice el material (el pedido es ${pedido}): no se puede comparar`;
    for (const [ca, ga] of a) {
      const tipo = /^(bulon|tuerca)/.test(ca) ? ca.split("_")[0] : "";
      if (tipo && ![...b.keys()].some(c => c.startsWith(tipo))) {
        if ([...b.keys()].some(c => /^(bulon|tuerca)/.test(c))) continue;
        return `el candidato no dice el grado del ${tipo.replace("bulon", "bulón")} (el pedido es ${String(pedido).slice(0, 40)}): no se puede comparar`;
      }
      if (![...b].some(([cb, gb]) => reemplaza(C, ca, ga, cb, gb, pedido, cand || descCand))) return `material ${cand || String(descCand).slice(0, 30)} no reemplaza a ${pedido}`;
    }
    if (fam === "VAL") return reglaCuerpo(C, pedido, clases(C, cand || "").size ? cand : descCand);
    return "";
  }
  const CARAS = ["rf", "ff", "rtj"], ROSCAS = ["npt", "bspt", "bspp"];
  function conexiones(...ts) {
    const out = new Set();
    for (let t of ts) {
      t = normP(t).replace(/\br\.?\s?f\.?(?=\s|\/|$)|\brfwn\b/g, " rf ").replace(/\br\.?\s?j\.?(?=\s|\/|$)|\brj\b/g, " rtj ")
        .replace(/\b[fm]npt\b|\bnptf\b|\bnpt-?[hm]\b/g, " npt ").replace(/\bsocket ?weld\b|\bsocket\b/g, " sw ")
        .replace(/\bbspp\b|\bbsp\b(?!t)/g, " bspp ").replace(/\bbe\b|\bbisel/g, " bw ");
      for (const k of [...CARAS, ...ROSCAS, "sw", "bw"]) if (new RegExp(`\\b${k}\\b`).test(t)) out.add(k);
      if (/\bbridad|\bbrida\b/.test(t) && !CARAS.some(k => out.has(k))) out.add("brida");
      if (/\brosca|\broscad/.test(t) && !ROSCAS.some(k => out.has(k))) out.add("rosca");
    }
    return out;
  }
  const tipos = c => new Set([...c].map(x => CARAS.includes(x) || x === "brida" ? "brida" : ROSCAS.includes(x) || x === "rosca" ? "rosca" : x));
  function reglaConexion(a, b) {
    if (!a.size || !b.size) return "";
    const inter = (s, ks) => new Set([...s].filter(x => ks.includes(x))), igual = (x, y) => x.size === y.size && [...x].every(v => y.has(v));
    const txt = `extremos o cara distintos (${[...b].sort().join("/").toUpperCase()} por ${[...a].sort().join("/").toUpperCase()})`;
    const ta = tipos(a), tb = tipos(b);
    if (![...ta].some(x => tb.has(x))) return txt;
    const ca = inter(a, CARAS), cb = inter(b, CARAS);
    if (ca.size && cb.size && !igual(ca, cb)) return txt;
    const ra = inter(a, ROSCAS), rb = inter(b, ROSCAS);
    if (ra.size && rb.size && !igual(ra, rb)) return txt;
    return "";
  }
  function schCanonico(sch, dn) {
    let s = String(sch || "").toUpperCase().replace(/[^A-Z0-9]/g, "").replace(/^(SCH|S)(?=\d)/, "");
    s = { "40S": "STD", "80S": "XS" }[s] || s;
    if (dn != null) { if (s === "STD" && dn <= 10) return "40"; if (s === "XS" && dn <= 8) return "80"; }
    return s;
  }
  function dnDe(C, v) {
    const t = normP(v), m = t.match(/\bdn ?(\d{2,3})\b|(\d{2,3}) ?mm\b/);
    if (m) return C.dn_nps[String(+(m[1] || m[2]))] ?? null;
    const n = t.match(/^\s*(\d+(?:[.,]\d+)?)/); return n ? parseFloat(n[1].replace(",", ".")) : null;
  }
  // el atributo "material" viene simplificado (pierde el grado): se usa el texto si nombra un material (compatibilidad.material_texto)
  const materialTexto = (C, atrib, texto) => clases(C, texto).size ? texto : (atrib || "");
  function incompatible(C, fam, ped, cand, textoPed, textoCand) {
    const m = reglaMaterial(C, fam, materialTexto(C, ped.material, textoPed || ""), materialTexto(C, cand.material, textoCand || ""), textoCand || ""); if (m) return m;

    X.utils.book_append_sheet(wb, x, "Índices");
    if ((cot.desvios || []).length) {
      const d = hoja(); cabecera(d, ["Pos", "Desvío", "Detalle"], [16, 50, 80]);
      cot.desvios.forEach((dv, k) => { put(d, A(1, k + 2), sinHtml(dv.tag)); put(d, A(2, k + 2), sinHtml(dv.titulo)); put(d, A(3, k + 2), sinHtml(dv.texto)); });
      X.utils.book_append_sheet(wb, d, "Desvíos");
    }
    return new Blob([X.write(wb, { type: "array", bookType: "xlsx" })], { type: "application/octet-stream" });
  }

  // ------------------------------------------------------------------ Excel para Compras
  // Igual que herramientas/lista_compras.py (pedido de Matías, 28-10-2026): la lista TAL CUAL el documento de origen
  // (cot.transcripcion: tablas con sus columnas y su texto), a la derecha la cantidad a comprar calculada (m, kg o un),
  // los kg aproximados y de dónde sale la cantidad; después Proveedor, Precio, Plazo y Anotaciones para Compras.
  // Lo que se compra y no está en el documento va aparte; los precios de referencia, en otra hoja (uso interno).
  function compras(cot) {
    const X = XLSX, wb = X.utils.book_new(), N = Number(cot.parametros.N) || 1;
    const est = (rgb, bold, color) => ({ font: { bold: !!bold, color: { rgb: color || "000000" } }, fill: { fgColor: { rgb } }, alignment: { wrapText: true, vertical: "top" } });
    const AZ = est("1D5F86", true, "FFFFFF"), GR = est("5D6B75", true, "FFFFFF"), OC = est("B7791F", true, "FFFFFF"), CG = est("EEF3F6"), CA = est("FBEFD6");
    const mats = cot.items.filter(i => i.grupo === "material");
    const esTira = it => /^(completar|sobrante)/i.test(String(it.descripcion || "").trim());
    const kgU = cot.kg_compras || {};
    const eqTxt = N === 1 ? (cot.equipo?.singular || "equipo") : (cot.equipo?.plural || "equipos");
    const tr = cot.transcripcion || { fuente: "Cotización de la página (no hay transcripción literal del documento)", tablas: [{
      titulo: "LISTA DE MATERIALES", columnas: ["Pos", "Descripción", "Ø", "Serie / SCH", "Material", "Marca / modelo", "Cant.", "Unidad"],
      filas: mats.filter(i => !esTira(i) && !/[a-z]$/i.test(String(i.pos))).map(i => { const p = i.plano || {};
        return [i.pos, p.descripcion || i.descripcion, p.diametro || "", p.serie_sch || "", p.material || "", p.modelo || "", i.cantidad, i.unidad]; }) }] };
    const enDoc = new Set(tr.tablas.flatMap(t => t.filas.map(f => String(f[0]).trim())));
    const filas = [[`PEDIDO DE COTIZACIÓN DE MATERIALES · ${cot.codigo}`], [`${cot.titulo || ""} · ${N} ${eqTxt}`], ["Origen de la lista", tr.fuente]];
    const estilos = {};
    const marca = (r, c, s) => { estilos[X.utils.encode_cell({ r, c })] = s; };
    // Números como celdas numéricas, nunca texto (Matías, 29-10-2026). Del documento se convierte solo lo que es un
    // número sin ambigüedad (numeroDe: 1.500 · 12,5); Pos/ID/código quedan como texto. Formato según la columna.
    const CLAVE = /^(pos|id|c[oó]d|art)/i;
    const docNum = (v, col) => typeof v === "string" && !CLAVE.test(col) && numeroDe(v) != null ? numeroDe(v) : v;
    const zDe = (col, v) => /precio|usd/i.test(col) ? "#,##0.00" : /serie|sch|clase/i.test(col) && Number.isInteger(v) ? "0" : Number.isInteger(v) ? "#,##0" : "#,##0.0###";
    const formatos = {};
    const fila = (vals, cab, r) => vals.map((v, c) => { const x = c < cab.length ? docNum(v, cab[c]) : v;
      if (typeof x === "number") formatos[X.utils.encode_cell({ r, c })] = zDe(cab[c] || "", x); return x; });
    let kgTot = 0;
    for (const t of tr.tablas) {
      filas.push([], [t.titulo]);
      const cab = [...t.columnas, "Cant. a comprar", "Unidad", "Kg aprox.", "Origen de la cantidad", "Proveedor", "Precio unit. USD", "Plazo", "Anotaciones"];
      const rc = filas.length; filas.push(cab);
      cab.forEach((_, c) => marca(rc, c, c < t.columnas.length ? AZ : c < t.columnas.length + 4 ? GR : OC));
      for (const f of t.filas) {
        const pos = String(f[0]).trim(), its = mats.filter(i => String(i.pos).trim() === pos);
        const extras = mats.filter(i => esTira(i) && new RegExp("^" + pos.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[b-z]$").test(String(i.pos).trim()));
        let calc = ["—", "", "", "no se cotiza"];
        if (its.length) {
          const q = its.reduce((a, i) => a + Number(i.cantidad), 0) * N, qe = extras.reduce((a, i) => a + Number(i.cantidad), 0) * N, u = its[0].unidad;
          const k = kgU[pos] != null ? Math.round(kgU[pos] * (q + qe) * 10) / 10 : "—";
          if (typeof k === "number") kgTot += k;
          const desc = its[0].plano?.descripcion || "";
          calc = [Math.round((q + qe) * 1000) / 1000, u, k, qe ? `${numg(q)} ${u} para ${numg(N)} ${eqTxt} + ${numg(qe)} ${u} para completar la tira`
            : /medida del dibujo|no indica/i.test(desc) ? "el documento no da cantidad: medida del dibujo (±20%)" : N === 1 ? "documento" : `documento × ${numg(N)}`];
        }
        const r = filas.length; filas.push(fila([...f, ...calc, "", "", "", ""], cab, r));
        for (let c = t.columnas.length; c < t.columnas.length + 8; c++) marca(r, c, c < t.columnas.length + 4 ? CG : CA);
      }
    }
    if (tr.nota) filas.push(["", "Nota del documento: " + tr.nota]);
    const adic = mats.filter(i => !enDoc.has(String(i.pos).trim()) && !esTira(i));
    if (adic.length) {
      filas.push([], ["ADICIONALES (no figuran en el documento; los agrega ITT)"]);
      const cab = ["Pos", "Descripción", "Especificación", "Cant. a comprar", "Unidad", "Kg aprox.", "Por qué", "Proveedor", "Precio unit. USD", "Plazo", "Anotaciones"];
      const rc = filas.length; filas.push(cab); cab.forEach((_, c) => marca(rc, c, c < 7 ? GR : OC));
      for (const i of adic) { const r = filas.length; filas.push(fila([i.pos, i.descripcion, i.especificacion || "", Number(i.cantidad) * N, i.unidad, "—", "compra mínima o nota del documento", "", "", "", ""], cab, r));
        for (let c = 7; c < 11; c++) marca(r, c, CA); }
    }
    filas.push([], [`Peso aproximado de lo que tiene tabla: ${num(kgTot, 0)} kg`],
      ["Columnas azules: tal cual el documento. Grises: cálculo de ITT. Amarillas: para que Compras complete (proveedor, precio sin IVA, plazo y anotaciones)."]);
    const ws = X.utils.aoa_to_sheet(filas);
    for (const [a, s] of Object.entries(estilos)) { ws[a] = ws[a] || { t: "s", v: "" }; ws[a].s = s; }
    for (const [a, z] of Object.entries(formatos)) if (ws[a]) ws[a].z = z;
    ws.A1.s = { font: { bold: true, sz: 14, color: { rgb: "1D5F86" } } };
    ws["!cols"] = [6, 46, 9, 8, 8, 8, 20, 11, 8, 10, 30, 22, 13, 12, 45].map(w => ({ wch: w }));
    X.utils.book_append_sheet(wb, ws, "Materiales");
    const serv = cot.items.filter(i => i.grupo !== "material");
    const sv = X.utils.aoa_to_sheet([["Servicio", "Aclaraciones", "Proveedor", "Precio unit. USD", "Plazo", "Anotaciones"], ...serv.map(i => [i.descripcion, i.especificacion || "", "", "", "", ""])]);
    sv["!cols"] = [50, 45, 22, 13, 12, 45].map(w => ({ wch: w }));
    X.utils.book_append_sheet(wb, sv, "Servicios");
    const ref = X.utils.aoa_to_sheet([["Pos", "Descripción", "Proveedor de referencia", "Último precio USD", "Fecha", "Tipo", "Coincide", "Diferencia"],
      ...cot.items.map(i => { const s = i.fuentes[0]; return [i.pos, i.descripcion, s.proveedor, Number(s.precio) || "SIN PRECIO", fecha(s.fecha), TIPOS[s.tipo] || s.tipo, COINC[s.coincide] || s.coincide || "", s.diferencia || ""]; }),
      [], ["Uso interno: no mandar al proveedor."]]);
    cot.items.forEach((i, k) => { const c = ref[X.utils.encode_cell({ r: k + 1, c: 3 })]; if (c && c.t === "n") c.z = "#,##0.00"; });
    ref["!cols"] = [7, 45, 40, 13, 11, 12, 12, 50].map(w => ({ wch: w }));
    X.utils.book_append_sheet(wb, ref, "Referencias internas");
    return new Blob([X.write(wb, { type: "array", bookType: "xlsx" })], { type: "application/octet-stream" });
  }

  // ------------------------------------------------------------------ PDF desde HTML (html2pdf)
  async function pdfDeHtml(html) {
    const caja = document.createElement("div");
    caja.style.cssText = "position:fixed;left:-10000px;top:0;width:718px;background:#fff;color:#1b2730";
    caja.innerHTML = html;
    document.body.appendChild(caja);
    try {
      return await html2pdf().set({
        margin: [10, 10, 12, 10], image: { type: "jpeg", quality: 0.95 }, html2canvas: { scale: 2, useCORS: true, backgroundColor: "#ffffff" },
        jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }, pagebreak: { mode: ["css", "legacy"], avoid: ["tr", ".nobreak"] }
      }).from(caja.firstElementChild).outputPdf("blob");
    } finally { caja.remove(); }
  }

    .doc .of-caja{background:#002060;color:#fff;padding:10px 12px;margin:10px 0}.doc .of-caja b{font-size:15px}
    .doc .of h2{color:#002060;border-color:#002060}.doc .of td,.doc .of p,.doc .of li{color:#002060}.doc .of th{background:#002060}
    .doc ul{margin:4px 0 4px 18px;padding:0}.doc p{margin:4px 0}

  function informeHtml(ctx) {

    const fila = it => {
      const s = it.fuentes[0], f = calc.filas.find(x => x.id === it.id) || { ajustado: it.cantidad * s.precio, factor: 1 };
      const cl = s.coincide === "igual" ? "ok" : s.coincide === "similar" ? "warn" : "bad";
      return `<tr><td>${esc(it.pos)}</td><td><b>${esc(it.descripcion)}</b><br><span class="muted">${esc(it.especificacion || "")}</span></td>

        <td>${esc(TIPOS[s.tipo] || s.tipo)} · ${esc(s.proveedor)}<br><span class="muted">${esc(s.origen || "")} · ${esc(fecha(s.fecha))}</span></td>

      <h2>Resumen (USD sin IVA)</h2>

      <table><tbody>
        <tr><td>Materiales (con ajuste por inflación)</td><td class="n">${usd(calc.sub.material)}</td><td class="n">factor ${num(p.FM)}</td></tr>

        ${calc.tav ? `<tr><td>Válvulas Taval (con contingencia)</td><td class="n">${usd(calc.tav)}</td><td class="n">factor ${num(calc.ftv)}</td></tr>` : ""}

        ${transporteIncluido(cot) ? `<tr><td>Transporte${cot.transporte?.destino ? " a " + esc(cot.transporte.destino) : ""} (en servicios, por ${esc(eq.singular)})</td><td class="n">${usd(transporteIncluido(cot).precio)}</td><td class="n">incluido en el precio</td></tr>` : ""}
        <tr><td>Flete + embalaje (por envío)</td><td class="n">${usd(calc.flete)}</td><td class="n">${p.TRANS ? "incluido" : transporteIncluido(cot) ? "no se usa" : "no incluido (EXW Quilmes Oeste)"}</td></tr>
        <tr><td>Ajuste por inflación incluido</td><td class="n">${usd(calc.costo - calc.costo0)}</td><td class="n">${p.AJ ? "aplicado hasta " + esc(fecha(p.fecha_referencia)) : "sin ajuste"}</td></tr>

      <h2>Materiales</h2>${tabla(cot.items.filter(i => i.grupo === "material"))}

      <p class="muted">Precios sin IVA. Pesos convertidos con el promedio mensual del dólar oficial BNA venta. Materiales ajustados con el CPI de EE.UU.; mano de obra y servicios con el costo local en dólares (IPC ÷ dólar).</p>

        ${firmaUrl && cot.estado === "aprobado" ? `<img src="${firmaUrl}">` : ""}<span class="muted">Generado el ${fecha(new Date())}</span></div></div>`;

  // ------------------------------------------------------------------ Ofertas (Word con la plantilla de ITT)
  const r_ = (texto, o = {}) => {
    const tam = Math.round((o.tam || 10) * 2), color = o.color || "002060";
    return `<w:r><w:rPr><w:rFonts w:ascii="Aptos" w:hAnsi="Aptos"/>${o.negrita ? "<w:b/>" : ""}${o.italica ? "<w:i/>" : ""}<w:color w:val="${color}"/><w:sz w:val="${tam}"/>${o.resaltar ? '<w:highlight w:val="yellow"/>' : ""}</w:rPr><w:t xml:space="preserve">${esc(texto)}</w:t></w:r>`;
  };
  const marcadores = (texto, o = {}) => String(texto ?? "").split(/(\[[^\]]+\])/).filter(Boolean).map(t => r_(t, { ...o, resaltar: t.startsWith("[") })).join("");
  const cm = v => Math.round(v * 567);

  function cuerpoOferta(tipo, ctx) {
    const { of, cot, calc, tituloXml, plano } = ctx;
    let x = "";
    const p = (runs, o = {}) => `<w:p><w:pPr>${o.keep ? "<w:keepNext/>" : ""}<w:spacing w:after="${o.after ?? 80}"/><w:ind w:left="${cm(o.sangria ?? 0.75)}"${o.colgante ? ` w:hanging="${cm(o.colgante)}"` : ""}/><w:jc w:val="${o.jc || "both"}"/></w:pPr>${runs}</w:p>`;
    const vacio = () => "<w:p/>";
    const titulo = t => {
      let xml = tituloXml.replace(/ w14:(paraId|textId)="[^"]*"/g, "");
      let primero = true;
      xml = xml.replace(/(<w:t(?: [^>]*)?>)([^<]*)(<\/w:t>)/g, (m, a, b, c) => { const v = primero ? esc(t) : ""; primero = false; return `<w:t xml:space="preserve">${v}</w:t>`; });
      xml = xml.replace("</w:pPr>", "<w:keepNext/></w:pPr>");
      return xml + p("", { keep: true, after: 0 });
    };
    const texto = (t, o = {}) => p(marcadores(t, { negrita: o.negrita }), { sangria: o.sangria ?? 0.75 });
    const vinetas = items => items.map(t => p(r_("•  ") + marcadores(t), { sangria: 1.25, colgante: 0.4, jc: "left", after: 40 })).join("");
    const tabla = (cab, filas, anchos, total, tam = 9, alinear) => {
      const borde = ["top", "left", "bottom", "right", "insideH", "insideV"].map(l => `<w:${l} w:val="single" w:sz="4" w:color="002060"/>`).join("");
      const celda = (t, w, o = {}) => `<w:tc><w:tcPr><w:tcW w:w="${cm(w)}" w:type="dxa"/>${o.span ? `<w:gridSpan w:val="${o.span}"/>` : ""}${o.cab ? '<w:shd w:val="clear" w:color="auto" w:fill="002060"/>' : ""}<w:vAlign w:val="center"/></w:tcPr><w:p><w:pPr><w:spacing w:after="0"/><w:jc w:val="${o.jc || "center"}"/></w:pPr>${marcadores(t, { negrita: o.cab || o.negrita, tam, color: o.cab ? "FFFFFF" : "002060" })}</w:p></w:tc>`;
      let t = `<w:tbl><w:tblPr><w:jc w:val="center"/><w:tblBorders>${borde}</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>${anchos.map(a => `<w:gridCol w:w="${cm(a)}"/>`).join("")}</w:tblGrid>`;
      t += `<w:tr>${cab.map((h, i) => celda(h, anchos[i], { cab: true })).join("")}</w:tr>`;
      for (const f of filas) t += `<w:tr>${f.map((v, i) => celda(v, anchos[i], { jc: (alinear || [])[i] === 0 ? "left" : "center" })).join("")}</w:tr>`;
      if (total) {
        const n = cab.length, span = n - 2;
        t += `<w:tr>${celda(total[0], anchos.slice(0, span).reduce((a, b) => a + b, 0), { span, negrita: true })}${celda(total[1], anchos[n - 2], { negrita: true })}${celda("", anchos[n - 1])}</w:tr>`;
      }
      return t + "</w:tbl>" + vacio();
    };
    x += `<w:p><w:r><w:br w:type="page"/></w:r></w:p>` + vacio() + vacio();
    const obj = (of.objeto || "").replace("{tipo}", tipo === "tecnica" ? "Técnica" : "Comercial");
    const it = of.item || {};
    const N = Number(cot.parametros.N);
    if (tipo === "economica") {
      x += titulo("OBJETO") + texto(obj) + titulo("PRECIO DE LA PROVISIÓN");
      x += tabla(["ITEM", "CÓDIGO", "DESCRIPCIÓN", "CANTIDAD", "USD UNIDAD", "USD SUBTOTAL", "Plazo de entrega (días)"],
        [[it.item, it.codigo, it.descripcion, String(N), usd(calc.precio_unitario), usd(calc.precio_unitario * N), it.plazo_dias],
         ...(calc.flete ? [["", "", of.descripcion_flete || "Flete y embalaje hasta destino", "1", usd(calc.flete), usd(calc.flete), ""]] : [])],

  // ------------------------------------------------------------------ tablas de ítems
  const FILTROS = [["", "Todos"], ["avisos", "Con avisos"], ["bad", "Para corregir"], ["sinprecio", "Sin precio"], ["est", "Estimados"], ["similar", "Similares"]];
  const ORDENES = [["", "Como se cargaron"], ["pos", "Posición"], ["importe", "Mayor importe"], ["desc", "Descripción"], ["fecha", "Precio más viejo"]];
  function tablaItems(grupoMat) {
    const c = calc(), todos = S.doc.cot.items.filter(i => grupoMat ? i.grupo === "material" : i.grupo !== "material");
    const avs = Busqueda.avisos(S.doc.cot), porItem = {};
    for (const a of avs) (porItem[a.id] ??= []).push(a);
    const v = S.vistaItems[grupoMat ? "m" : "s"], imp = id => c.filas.find(f => f.id === id)?.ajustado || 0;
    const pasa = { "": () => true, avisos: i => porItem[i.id], bad: i => porItem[i.id]?.some(a => a.nivel === "bad"), sinprecio: i => !i.fuentes[0].precio,
      est: i => i.fuentes[0].tipo === "est", similar: i => i.fuentes[0].coincide === "similar" }[v.f] || (() => true);
    const natural = (a, b) => (parseFloat(a.pos) || 9e9) - (parseFloat(b.pos) || 9e9) || String(a.pos).localeCompare(String(b.pos));
    const ord = { pos: natural, importe: (a, b) => imp(b.id) - imp(a.id), desc: (a, b) => a.descripcion.localeCompare(b.descripcion), fecha: (a, b) => String(a.fuentes[0].fecha).localeCompare(String(b.fuentes[0].fecha)) }[v.o];
    let items = todos.filter(pasa); if (ord) items = [...items].sort(ord);
    const k = grupoMat ? "m" : "s";
    const controles = todos.length ? `<div class="fila filtros-items"><label><span>Mostrar</span><select id="fi-${k}" data-vi="${k}" data-c="f">${FILTROS.map(([x, n]) => `<option value="${x}" ${v.f === x ? "selected" : ""}>${n}</option>`).join("")}</select></label>
      <label><span>Ordenar</span><select id="oi-${k}" data-vi="${k}" data-c="o">${ORDENES.map(([x, n]) => `<option value="${x}" ${v.o === x ? "selected" : ""}>${n}</option>`).join("")}</select></label>
      <span class="small muted">${items.length} de ${todos.length} ítem(s)</span></div>` : "";
    const celdaAvisos = it => { const a = porItem[it.id]; if (!a) return `<span class="muted small">—</span>`;
      const bad = a.some(x => x.nivel === "bad");
      return `<details class="avs ${bad ? "bad" : "warn"}"><summary title="${E(a.map(x => x.corto).join(" · "))}">${bad ? "✖" : "⚠"} ${a.length}</summary><ul>${a.map(x => `<li>${E(x.corto)}</li>`).join("")}</ul></details>`; };
    if (todos.length && !items.length) return controles + `<div class="vacio">Ningún ítem con ese filtro.</div>`;
    if (!items.length) return `<div class="vacio">${grupoMat ? "Todavía no hay materiales. Buscalos abajo en el catálogo y agregalos, o cargá uno a mano." : "Todavía no hay mano de obra ni servicios. Buscalos en el catálogo o usá las calculadoras."}</div>`;
    const estado = it => { const a = porItem[it.id] || [];
      return a.some(x => x.nivel === "bad") ? `<span class="pill bad">Corregir</span>` : a.length ? `<span class="pill warn">Revisar · ${a.length}</span>` : `<span class="pill ok">Bien</span>`; };
    S.itAbiertos ??= new Set();
    const k2 = grupoMat ? "m" : "s";
    return controles + `<div class="tbl"><table class="items"><thead><tr><th>Pos.</th><th>Ítem</th><th class="n">Cantidad</th><th>Unidad</th><th class="n">USD unitario</th><th class="n">USD ajustado</th><th>Estado</th><th></th></tr></thead><tbody>
      ${items.map(it => { const s = it.fuentes[0], ab = S.itAbiertos.has(it.id), avs_ = porItem[it.id] || []; return `<tr>
        <td class="ed" data-l="Pos." style="width:70px"><input id="p-${E(it.id)}" data-it="${E(it.id)}" data-c="pos" value="${E(it.pos)}" style="width:58px" aria-label="Posición"></td>
        <td><button class="it-abrir" data-l-desc data-a="it-abrir" data-id="${E(it.id)}" aria-expanded="${ab}"><span class="flecha" aria-hidden="true">${ab ? "▾" : "▸"}</span><span>${E(it.descripcion)}</span></button></td>
        <td class="ed" data-l="Cantidad"><input id="q-${E(it.id)}" type="text" inputmode="decimal" class="num" data-it="${E(it.id)}" data-c="cantidad" value="${NI(it.cantidad)}" aria-label="Cantidad"></td><td data-l="Unidad">${E(it.unidad)}</td>
        <td class="ed" data-l="USD unitario"><input id="u-${E(it.id)}" type="text" inputmode="decimal" class="num" data-it="${E(it.id)}" data-c="precio" value="${NI(s.precio)}" aria-label="Precio unitario"></td>
        <td class="n" data-l="USD ajustado" data-sub="${E(it.id)}">${num(c.filas.find(f => f.id === it.id)?.ajustado)}</td>
        <td data-l="Estado">${estado(it)}</td>
        <td class="acc-it"><button class="chico" data-a="editar" data-id="${E(it.id)}">Editar</button></td></tr>
        <tr class="it-det" ${ab ? "" : "hidden"}><td colspan="8"><div class="it-det-grid">
          ${it.especificacion ? `<div><b>Especificación</b>${E(it.especificacion)}</div>` : ""}
          <div><b>Precio</b>${E(Documentos.TIPOS[s.tipo] || s.tipo)} · ${E(s.proveedor)} · ${E(F(s.fecha))}</div>
          <div><b>Coincide con el plano</b>${E(Documentos.COINC[s.coincide] || "—")}${s.diferencia ? " · " + E(s.diferencia) : ""}</div>
          ${avs_.length ? `<div><b>Avisos</b>${avs_.map(x => E(x.corto)).join("<br>")}</div>` : ""}
        </div></td></tr>`; }).join("")}
      <tr class="total"><td></td><td>Subtotal por ${E(S.doc.cot.equipo?.singular || "equipo")}${items.length < todos.length ? " (todos los ítems)" : ""}</td><td colspan="3"></td><td class="n" data-subtot="${grupoMat ? "material" : "srv"}"></td><td colspan="2"></td></tr></tbody></table></div>`;
  }

    return `<div class="fila barra-sel" id="sel-${k}" ${n ? "" : "hidden"}><b id="sel-${k}-n">${n} seleccionado(s)</b>

  // ------------------------------------------------------------------ pestaña Materiales
  function tabMateriales() {
    return `<section><div class="sec-head"><h2>Materiales de la cotización</h2><button data-a="manual" data-g="material">Cargar a mano</button></div>${tablaItems(true)}</section>

    };
    const cs = f.fam ? Busqueda.campos(S.datos, f.fam) : [];
    const etq = { tipo: "Tipo", diametro: "Ø", diametro2: "Ø 2", serie: "Serie", schedule: "Schedule", material: "Material", trim: "Trim / asiento", extremos: "Extremos", cara: "Cara", medida: "Medida", largo_mm: "Largo mm", espesor_mm: "Espesor mm", costura: "Costura", revestimiento: "Revestimiento", rango: "Rango", conexion: "Conexión", designacion: "Designación" };
    return `<section class="panel" id="bus-mat"><div class="sec-head"><h3>Buscar en el catálogo de materiales</h3><span class="eyebrow">igual primero · después similares con sus diferencias</span></div>
        <label class="bus-gral"><span>Buscar en todo el catálogo (descripción, medidas, material, marca o proveedor)</span><input id="fm-texto" data-fm="texto" type="search" value="${E(f.texto || "")}" placeholder="ej. esférica 2 600 · brida ciega 4 150 · renard · 316L"></label>

          ${f.fam ? [...new Set(["tipo", ...cs, ...(["VAL", "INS"].includes(f.fam) ? ["marca"] : [])])].map(c => sel(c, etq[c] || c)).join("") : ""}

    const r = Busqueda.materiales(S.datos, S.fm);
    $("#fm-info").textContent = `${r.total} resultado(s)${r.total > r.res.length ? ` (se muestran ${r.res.length}: agregá palabras para achicar)` : ""}` + (!S.fm.fam ? " · elegí una familia para ver iguales y similares" : r.clasifica ? "" : Busqueda.CON_TIPO.includes(S.fm.fam) ? " · elegí el tipo de pieza para ver iguales y similares" : " · elegí características para comparar") + (r.faltan.length && r.clasifica ? ` · para distinguir igual de similar falta: ${r.faltan.join(", ")}` : "");

        <div class="precio">${m.p ? "USD " + num(m.p) + " / " + E(m.u || "un") : '<span class="err">sin precio confiable</span>'}<div class="small muted">${E(F(m.fe))} · ${E(m.tp)}</div></div>

    }).join("") : `<div class="vacio">No hay materiales con esos filtros. Probá quitar alguno o cargalo a mano.</div>`;

  // Repositorio y biblioteca (decisión de Matías, 29-10-2026): manda el repositorio; cuando la cotización está lista, el

  // Avisos agrupados por tipo ("Pieza similar (18)"), desplegables: así se ve qué clase de problema hay sin leer 59 renglones
  function gruposAvisos(lista, abiertos) {
    const g = new Map();
    for (const a of lista) {
      const c = a.corto || a.txt, t = c.split(/[:(]/)[0].replace(/\d[\d.,]*/g, "").replace(/\s+/g, " ").trim();
      const k = /^precio de hace/.test(c) ? "Precio de hace más de 6 meses" : /^el catálogo/.test(c) ? "El catálogo tiene un precio más nuevo"
        : t.charAt(0).toUpperCase() + t.slice(1);
      (g.get(k) || g.set(k, []).get(k)).push(a);
    }
    return [...g].sort((x, y) => y[1].length - x[1].length).map(([k, xs]) => xs.length === 1 && !xs[0].corto ? `<p class="small">${E(xs[0].txt)}</p>`
      : `<details class="grupo-av" ${abiertos && g.size < 4 ? "open" : ""}><summary>${E(k)} <span class="cnt">${xs.length}</span></summary><ul>${xs.map(a => `<li>${E(a.corto ? a.txt.slice(0, a.txt.length - a.corto.length - 2) + " — " + a.corto : a.txt)}</li>`).join("")}</ul></details>`).join("");
  }
  function panelAntecedentes(c) {
    const r = Antecedentes.comparar(S.doc.cot, S.datos, c.precio_unitario, c.costo), pc = v => v == null ? "—" : num(v * 100, 0) + "%";
    return `<section><div class="sec-head"><h3>Antecedentes parecidos (P8)</h3><span class="eyebrow">familia ${E(r.nombreFamilia || r.familia)}${r.nombreSubtipo ? " · " + E(r.nombreSubtipo) : ""} · costo contra costo</span></div>
      <p class="small muted">Se compara el costo por equipo (el precio de venta mezcla factor, flete, caución y alcance). El costo del antecedente es el de su ficha, a su fecha y sin ajustar; si la ficha no lo permite, queda el precio de venta como "solo venta". Una diferencia de más del 15% no es un error: hay que explicarla rubro por rubro antes de presentar el número.</p>
      ${r.filas.length ? `<div class="tbl"><table><thead><tr><th>#</th><th>Antecedente</th><th>Fecha</th><th class="n">Costo por equipo</th><th class="n">Costo: esta vs. ant.</th><th class="n">Materiales ant. / esta</th><th class="n">MO y serv. ant. / esta</th><th>Factor</th><th class="n">Precio de venta (ref.)</th><th>Por qué se parece</th></tr></thead><tbody>
        ${r.filas.map((f, i) => `<tr><td>${i + 1}</td><td><div class="d">${E(f.id)}</div><div class="sp">${E(f.cliente)}${f.oferta ? " · " + E(f.oferta) : ""}${f.subtipo ? " · " + E(f.subtipo) : ""} · ${E(f.descripcion.slice(0, 120))}</div></td><td class="small">${E(F(f.fecha))}</td>
          <td class="n">${f.cu ? num(f.cu, 0) + " " + E(f.moneda) : "—"}</td>
          <td class="n">${f.dif == null ? `<span class="muted small">solo venta: ${f.difV > 0 ? "+" : ""}${num(f.difV * 100, 0)}%${f.cnota ? " · " + E(f.cnota) : ""}</span>` : f.otra ? '<span class="muted">otra escala</span>' : `<span class="pill ${f.ojo ? "warn" : "ok"}">${f.dif > 0 ? "+" : ""}${num(f.dif * 100, 0)}%</span>`}</td>
          <td class="n small">${pc(f.reparto)} / ${pc(r.matN)}</td><td class="n small">${f.reparto == null ? "—" : pc(1 - f.reparto)} / ${pc(r.moN)}</td>
          <td>${E(f.factor || "—")}</td><td class="n small">${num(f.pu, 0)} ${E(f.moneda)}</td><td class="small muted">${E(f.razones.join(" · "))}</td></tr>`).join("")}</tbody></table></div>` : ""}
      ${r.avisos.length ? `<div class="aviso"><ul>${r.avisos.map(a => `<li>${E(a)}</li>`).join("")}</ul></div>` : ""}</section>`;
  }

  // ------------------------------------------------------------------ cambio de estado (con controles; la herramienta nunca envía nada)
  function dialogoEstado(d) {
    const cot = S.doc.cot, malos = Busqueda.avisos(cot).filter(a => a.nivel === "bad"), act = cot.estado;
    let error = "", texto = "", extra = "";
    if (d === act) return;
    if (d === "revisado") {
      if (malos.length) error = `Hay ${malos.length} aviso(s) para corregir. Corregilos antes de pasar a revisado (ver Resumen y descargas).`;
      texto = "Confirmá que una persona revisó el cómputo contra el plano (procedimiento P10) y que los avisos para revisar están explicados.";
    } else if (d === "aprobado") {
      if (act !== "revisado") error = "Primero tiene que estar revisada.";
      else if (malos.length) error = `Hay ${malos.length} aviso(s) para corregir.`;
      texto = "Al aprobar, la oferta sale sin la leyenda de borrador y con la firma, y la cotización queda bloqueada para cambios.";
      extra = `<label><span>¿Quién aprueba? (Matías o la dirección)</span><input id="ap-por" autocomplete="off"></label>`;
    } else if (d === "enviado") {
      if (act !== "aprobado") error = "Solo se marca enviada una cotización aprobada.";
      texto = "La herramienta no envía nada. Marcala como enviada solo si ya la mandaste vos al cliente.";
    } else if (d === "borrador") {
      texto = act === "revisado" ? "Vuelve a borrador para seguir cambiándola." : "Vuelve a borrador: se desbloquea, se borra la aprobación y la oferta vuelve a salir con la leyenda de borrador.";
    }
    capa.hidden = false;
    capa.innerHTML = `<div class="capa"><section class="panel" role="dialog" aria-label="Cambiar estado"><h2>Pasar a "${E(d)}"</h2>
      ${error ? `<div class="aviso bad">${E(error)}</div>` : `<p>${E(texto)}</p>${extra}`}
      <p class="err" id="est-err"></p><div class="fila fin"><button data-a="cerrar">${error ? "Volver" : "Cancelar"}</button>
      ${error ? "" : `<button class="prim" data-a="estado-ok" data-v="${E(d)}">Pasar a ${E(d)}</button>`}</div></section></div>`;
    $("#ap-por")?.focus();
  }

  // ------------------------------------------------------------------ eventos
  // Campos de números (input.num): punto de miles, coma decimal, 2 decimales como máximo. Mientras se escribe, si no
  // cumple, el campo queda en rojo con el motivo; al salir del campo se reescribe en el formato de la página
  // (así se ve cómo se entendió: "1500" → "1.500") o se muestra el motivo si quedó mal.
  document.addEventListener("input", ev => {
    const el = ev.target; if (!el.classList?.contains("num")) return;
    el.setCustomValidity(Documentos.errorNumero(el.value)); el.title = el.validationMessage || "";
  }, true);
  document.addEventListener("focusin", ev => { const el = ev.target; if (el.classList?.contains("num") && !el.placeholder) el.placeholder = "1.234,56"; });
  document.addEventListener("focusout", ev => {
    const el = ev.target; if (!el.classList?.contains("num") || !el.value.trim()) return;
    const v = NUM(el.value);
    if (v == null) { el.setCustomValidity(Documentos.errorNumero(el.value)); el.reportValidity(); }
    else { el.setCustomValidity(""); el.title = ""; el.value = NI(v); el.classList.remove("mal"); }
  });
  app.addEventListener("input", ev => {
    const el = ev.target;
    if (bloqueada() && (el.dataset.b || el.dataset.bl || el.dataset.it || el.dataset.glob || el.dataset.rbPropia || el.dataset.tr || el.dataset.ta !== undefined)) {
      toast(`La cotización está ${S.doc.cot.estado}: para cambiarla, volvé a borrador.`); render(); return;
    }
    if (el.dataset.b && S.doc) {
      let v = el.value;
      if (el.dataset.t === "fecha") { v = Documentos.isoDe(v); el.classList.toggle("mal", !v); if (!v) return; }
      if (el.dataset.t === "number") { v = v.trim() === "" ? (el.dataset.b === "cot.parametros.FTV" ? 1 : 0) : NUM(v); el.classList.toggle("mal", v == null); if (v == null) return; }
      ponerRuta(S.doc, el.dataset.b, v);
      if (el.dataset.b === "cot.estado") S.doc.oferta.estado = v;
      if (el.dataset.b.startsWith("cot.transporte")) { precioTransporte(); pintarRubros(); }
      if (el.dataset.b === "cot.parametros.ph_horas") pintarRubros();
      refrescar(); guardarPronto();
      if (el.tagName === "SELECT" || el.dataset.b.startsWith("cot.plazo")) { if (el.tagName === "SELECT" || ev.type === "change") render(); }
    } else if (el.dataset.bl && S.doc) {
      ponerRuta(S.doc, el.dataset.bl, el.value.split("\n").map(x => x.trim()).filter(Boolean)); guardarPronto();
    } else if (el.dataset.it && S.doc) {
      const it = S.doc.cot.items.find(i => i.id === el.dataset.it);
      if (el.dataset.c === "precio" || el.dataset.c === "cantidad") {
        const v = el.value.trim() === "" ? 0 : NUM(el.value); el.classList.toggle("mal", v == null || v < 0); if (v == null || v < 0) return;
        if (el.dataset.c === "precio") it.fuentes[0].precio = v; else it.cantidad = v;
      }
      else it[el.dataset.c] = el.value;
      refrescar(); guardarPronto();
      if (S.tab === "servicios") pintarRubros();
    } else if (el.dataset.fm !== undefined) {
      const k = el.dataset.fm; S.fm[k] = el.value;

  // ------------------------------------------------------------------ descargas
  async function bytesDe(url) {
    if (!url) return null;
    try {
      const blob = await (await fetch(url)).blob();
      const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(blob); });
      return { bytes: new Uint8Array(await blob.arrayBuffer()), tipo: blob.type || "image/png", ancho: img.naturalWidth, alto: img.naturalHeight, url: img.src };
    } catch (e) { return null; }
  }
  async function contexto() {

    const aprobado = cot.estado === "aprobado" || cot.estado === "enviado";
    const firma = await bytesDe(fir?.firma_url), plano = await bytesDe(of.imagen_plano_url);
    const pl = cot.plazo || {};
    return { cot, of: Documentos.completarOferta(cot, of), calc: c, firmante: fir, firma, firmaUrl: firma?.url, planoImg: plano, planoUrl: plano?.url, datos: S.datos, aprobado, logo: S.datos.logo,
      avisos: Busqueda.avisos(cot), plazo: { texto: `${pl.texto || ""}. ${pl.nota || ""}` } };

  async function generar(k, ctx) {

    if (/^(tec|eco)_/.test(k) && Busqueda.plazoBloquea(cot)) throw new Error(Busqueda.plazoBloquea(cot));

      case "presupuesto": return Documentos.planilla(cot, S.datos.indices, S.datos);
