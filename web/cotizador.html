<style>
/* Layout: mesa de trabajo de cotización — barra superior fija, carátula de la cotización, pestañas por rubro, tablas a todo el ancho; misma identidad que los informes de cotización */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --ink:#18232b; --muted:#5d6b75; --line:#d5dde2; --soft:#e8edf0;
  --accent:#1d5f86; --accent-ink:#ffffff; --accent-soft:#dcebf4;
  --ok:#2c7a4b; --ok-soft:#ddf1e4; --warn:#9a6205; --warn-soft:#fbefd6; --bad:#a3392f; --bad-soft:#f8e1de;
  --azul-itt:#002060;
  --f-disp:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11181d; --panel:#172129; --ink:#e3e9ed; --muted:#97a6b0; --line:#2c3a44; --soft:#1e2a33;
  --accent:#6cb3de; --accent-ink:#0d1a22; --accent-soft:#1d3546;
  --ok:#73c895; --ok-soft:#183427; --warn:#e5b25a; --warn-soft:#3a2e15; --bad:#ef8b80; --bad-soft:#3d1f1c; --azul-itt:#8fb4ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11181d; --panel:#172129; --ink:#e3e9ed; --muted:#97a6b0; --line:#2c3a44; --soft:#1e2a33;
  --accent:#6cb3de; --accent-ink:#0d1a22; --accent-soft:#1d3546;
  --ok:#73c895; --ok-soft:#183427; --warn:#e5b25a; --warn-soft:#3a2e15; --bad:#ef8b80; --bad-soft:#3d1f1c; --azul-itt:#8fb4ff; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.barra .in,.main{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.barra .in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-block:10px}
.marca{font:800 18px/1 var(--f-disp);font-stretch:80%;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.marca i{display:inline-block;width:10px;height:22px;background:var(--azul-itt);border-radius:1px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none;font-weight:500;padding:6px 10px;border-radius:3px}
nav a[aria-current="page"]{color:var(--ink);background:var(--soft)}
.datos-al{margin-left:auto;font:500 12px var(--f-mono);color:var(--muted)}
.datos-al.viejo{color:var(--bad)}
.main{display:flex;flex-direction:column;gap:22px;padding-block:22px 72px}
h1,h2,h3{font-family:var(--f-disp);font-stretch:85%;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(24px,3.6vw,34px);font-weight:750}
h2{font-size:20px;font-weight:700}
h3{font-size:15.5px;font-weight:650}
p{margin:0;max-width:72ch}
.num,.mono,td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 11.5px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;border-bottom:2px solid var(--ink);padding-bottom:6px}

button:hover{border-color:var(--accent)}
button.prim{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:6px 8px;width:100%;min-width:0}

input[type=number],input.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
:is(input,select,textarea,button,a):focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.pill.ok{color:var(--ok);background:var(--ok-soft)} .pill.warn{color:var(--warn);background:var(--warn-soft)} .pill.bad{color:var(--bad);background:var(--bad-soft)} .pill.info{color:var(--accent);background:var(--accent-soft)}

tr.total td{background:var(--soft);font-weight:600}

.cab{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:end;border-bottom:3px solid var(--ink);padding-bottom:14px}

/* totales */
.totales{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);background:var(--panel);border-radius:4px}

.totales>div:last-child{border-right:0}
.totales .v{font:500 clamp(18px,2.4vw,26px)/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.totales .s{font-size:12px;color:var(--muted)}
.totales .prim .v{color:var(--accent)}

/* pestañas */
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:6px;background:var(--soft);border:1px solid var(--line);border-radius:8px;margin:6px 0 4px}
@media (max-width:640px){.tabs button{font-size:14px;padding:8px 10px;flex:1 1 auto;justify-content:center}}
.tabs button{font:600 15px var(--f-body);border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);padding:10px 16px;display:flex;align-items:center;gap:7px}
.tabs button:hover{border-color:var(--accent);color:var(--accent)}

/* buscador */

.filtros-items{gap:12px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
// Motor de cálculo del cotizador: mismas fórmulas que herramientas/armar_cotizacion.py (calcular y factor).
// Se prueba contra Python con web/probar_motor.js (la CAPEX tiene que dar costo 5.644,88 · unitario 7.620,59 · total 15.241,18).
const Motor = (() => {
  // idx: [{mes:"2024-01", local, cpi}, ...] ordenado por mes
  function factorAjuste(item, idx, fref, aplicar) {
    if (!aplicar) return 1;
    const col = item.grupo !== "material" ? "local" : "cpi";
    const f = (item.fuentes[0].fecha || "").slice(0, 7);
    let mes = f < fref ? f : fref;            // min(fecha, referencia)
    if (mes < idx[0].mes) mes = idx[0].mes;  // max(…, primer mes de la tabla)
    const en = m => { let v = idx[0]; for (const r of idx) if (r.mes <= m) v = r; return v[col]; };
    return en(fref) / en(mes);
  }

  function redondear(x, d = 2) {
    const k = 10 ** d;
    return Math.round((x + Number.EPSILON) * k) / k;
  }

  // Índices de la cotización: los congelados (al pasar a revisado) o los vigentes de la base
  function indicesDe(cfg, idx) {
    const cg = cfg.indices_congelados;
    return cg && cg.filas && cg.filas.length ? cg.filas : idx;
  }

  const esTaval = it => it.grupo === "material" && !!it.taval;

  function calcular(cfg, idx) {
    idx = indicesDe(cfg, idx);
    const p = cfg.parametros, fref = p.fecha_referencia.slice(0, 7);
    const sub = { material: 0, mo: 0, servicio: 0, taval: 0 }, sub0 = { material: 0, mo: 0, servicio: 0, taval: 0 };
    const ftv = p.FTV ?? 1;  // válvulas Taval (empresa del grupo): factor aparte, por defecto 1
    const filas = cfg.items.map(it => {
      const fa = factorAjuste(it, idx, fref, p.AJ);
      const base = it.cantidad * it.fuentes[0].precio, g = esTaval(it) ? "taval" : it.grupo;
      sub[g] += base * fa;
      sub0[g] += base;
      return { id: it.id, base, factor: fa, ajustado: base * fa };
    });
    const cont = sub.material * p.CONT / 100, tav = sub.taval * (1 + p.CONT / 100);
    const costo = sub.material + cont + tav + sub.mo + sub.servicio;
    const costo0 = (sub0.material + sub0.taval) * (1 + p.CONT / 100) + sub0.mo + sub0.servicio;
    const precio = redondear((sub.material + cont) * p.FM + tav * ftv + (sub.mo + sub.servicio) * p.FMO, 2);
    const flete = p.TRANS ? (p.TR_ARS / p.TC + p.TR_EMB) * p.TR_F : 0;
    return { sub, cont, tav, ftv, costo, costo0, precio_unitario: precio, flete, total: redondear(precio * p.N + flete, 2), filas };
  }

  // Escenarios de factor (el factor lo define la dirección; la herramienta propone 1,35 y muestra alternativas)
  function escenarios(cfg, idx, factores = [1.25, 1.30, 1.35, 1.40, 1.50]) {
    return factores.map(F => {
      const c = calcular({ ...cfg, parametros: { ...cfg.parametros, FM: F, FMO: F } }, idx);
      return { F, unitario: c.precio_unitario, total: c.total, margen: 1 - c.costo / c.precio_unitario };
    });
  }
  return { factorAjuste, calcular, escenarios, redondear, indicesDe, esTaval };
})();
if (typeof module !== "undefined") module.exports = Motor;

// Comparación con antecedentes (paso P8): misma puntuación que herramientas/buscar_antecedentes.py y misma lectura que
// herramientas/comparar_antecedentes.py (5 más parecidos con precio; diferencia de más del 15% hay que explicarla; más de
// 4 veces es otra escala). Los datos vienen de datos.json → antecedentes (índice de proyectos 2025–2026).
const Antecedentes = (() => {
  const SERIES = [150, 300, 600, 900, 1500, 2000, 2500, 3000, 5000, 6000, 10000];

  function raiz(w) {
    if (w.length > 4 && w.endsWith("s")) w = w.slice(0, -1);
    if (w.length > 4 && /[eo]$/.test(w)) w = w.slice(0, -1);
    return w;
  }
  function palabras(t, A) {
    const vac = new Set(A.vacias), cor = new Set(A.cortas);
    const ws = new Set((t.match(/[a-z][a-z0-9]{2,}/g) || []).filter(w => (w.length > 3 || cor.has(w)) && !vac.has(w)));
    return [...new Set([...ws].map(raiz))];
  }
  function etiquetas(t, A) {
    const tags = [];
    for (const [k, claves] of Object.entries(A.claves)) if (claves.some(c => t.includes(c)) && !tags.includes(k)) tags.push(k);
    if (tags.length > 1 && tags.includes("OT")) tags.splice(tags.indexOf("OT"), 1);
    return tags.length ? tags : ["OT"];
  }
  function vecino(a, b, T) {
    const i = T.indexOf(a), j = T.indexOf(b);
    return i >= 0 && j >= 0 ? Math.abs(i - j) === 1 : Math.abs(a - b) / Math.max(a, b) <= 0.25;
  }
  // Ø del plano en pulgadas: 2" · 2 1/2" · 1/2" · 2.5
  function pulgadas(s) {
    const t = Busqueda.norm(s).replace(/"/g, " ").trim(), m = t.match(/^(\d+)?\s*(?:(\d+)\/(\d+))?/);
    if (!m || (!m[1] && !m[2])) return parseFloat(t.replace(",", ".")) || null;
    return (m[1] ? +m[1] : 0) + (m[2] ? +m[2] / +m[3] : 0);
  }

  function puntuar(p, q, idf, hoy, A) {
    const razones = []; let s = 0;
    const tags = p.tags.split(" ");
    if (q.familia) {
      if (p.fam === q.familia) s += 15;
      else if (tags.includes(q.familia)) { s += 5; razones.push(`familia ${q.familia} secundaria`); }
      else return null;
    }
    if (q.palabras.length) {
      const pw = new Set(p.w.split(" ")), comunes = q.palabras.filter(w => pw.has(w));
      const tot = q.palabras.reduce((a, w) => a + (idf[w] ?? 3), 0);
      s += tot ? 40 * comunes.reduce((a, w) => a + (idf[w] ?? 3), 0) / tot : 0;
      if (comunes.length) razones.push("texto: " + comunes.sort((a, b) => (idf[b] ?? 3) - (idf[a] ?? 3)).slice(0, 5).join(", "));
    }
    const dias = p.dia.split(" ").filter(Boolean).map(Number);
    if (q.diametro) {
      if (dias.includes(q.diametro)) { s += 15; razones.push(`Ø${q.diametro}"`); }
      else if (dias.some(d => vecino(q.diametro, d, A.tamanos))) { s += 7; razones.push("Ø cercano"); }
    }
    if (q.serie && p.ser.split(" ").includes(q.serie)) { s += 12; razones.push("serie " + q.serie); }
    if (q.cliente && Busqueda.norm(p.cl + " " + p.clf + " " + p.id).includes(Busqueda.norm(q.cliente))) { s += 8; razones.push("mismo cliente"); }
    if (p.pl) { s += 8; razones.push("planilla de costo"); }
    if (p.prov && p.prov !== "0") s += 3;
    if (p.oc) { s += 3; razones.push("ganada (OC)"); }
    if (p.conf === "baja") s -= 5;
    const anios = Math.max(0, (hoy - new Date(p.fe)) / (365.25 * 864e5));
    return { s: s * Math.max(0.4, 1 - 0.2 * anios), razones };
  }

  function comparar(cot, datos, precio_unitario) {
    const A = datos.antecedentes; if (!A) return { filas: [], avisos: ["No hay índice de proyectos en esta versión de la página"] };
    const texto = Busqueda.norm((cot.titulo || "") + " " + cot.items.map(i => i.descripcion).join(" "));
    const familia = etiquetas(texto, A)[0];
    const dias = cot.items.filter(i => i.grupo === "material").map(i => pulgadas(i.plano?.diametro || "")).filter(Boolean);
    const series = cot.items.map(i => (String(i.plano?.serie_sch || "").match(/\d+/g) || []).map(Number)).flat().filter(n => SERIES.includes(n));
    const q = { familia, palabras: palabras(Busqueda.norm(cot.titulo || ""), A), diametro: dias.length ? Math.max(...dias) : null,
      serie: series.length ? String(Math.max(...series)) : null, cliente: cot.cliente?.nombre || "" };
    const df = {};
    for (const p of A.proyectos) for (const w of new Set(p.w.split(" "))) df[w] = (df[w] || 0) + 1;
    const N = A.proyectos.length, idf = Object.fromEntries(Object.entries(df).map(([w, n]) => [w, Math.log(N / n)]));
    const hoy = new Date(), codigo = Busqueda.norm(cot.codigo || "");
    const res = [];
    for (const p of A.proyectos) {
      if (!p.pu || (codigo && Busqueda.norm(p.id).includes(codigo))) continue;
      const r = puntuar(p, q, idf, hoy, A);
      if (r) res.push({ ...r, p });
    }
    res.sort((a, b) => (Math.round(b.s * 10) - Math.round(a.s * 10)) || String(b.p.fe).localeCompare(String(a.p.fe)));
    const filas = res.slice(0, 5).map(({ p, razones }) => {
      const dif = precio_unitario / p.pu - 1, otra = dif > 3 || dif < -0.75;
      return { id: p.id, fecha: p.fe, cliente: p.cl, descripcion: p.d, oferta: p.of, pu: p.pu, moneda: p.mon, factor: p.fac, reparto: p.rep, dif, otra, ojo: !otra && Math.abs(dif) > 0.15, razones };
    });
    const avisos = filas.filter(f => f.ojo).slice(0, 2).map(f => `Precio ${(f.dif * 100).toFixed(0)}% contra "${f.id.slice(0, 50)}" (${Math.round(f.pu).toLocaleString("es-AR")} ${f.moneda}, ${f.fecha.split("-").reverse().join("-")}): explicar la diferencia rubro por rubro (P8)`);
    if (filas.length && filas.every(f => f.otra)) avisos.push("Ningún antecedente de los 5 primeros es de la misma escala: comparar a mano");
    if (!filas.length) avisos.push(`No hay antecedentes de la familia ${familia} con precio en el índice: comparar a mano`);
    return { familia, nombreFamilia: A.familias[familia] || familia, consulta: q, filas, avisos };
  }
  return { comparar, palabras, etiquetas, pulgadas };
})();

          TIPOS[s.tipo] || s.tipo, s.proveedor, s.origen, serial(s.fecha), it.id, { f: `MAX(0,('Cotización'!$H$7-K${i})/30.4375)` },
          { f: `IF('Cotización'!$H$6=1,VLOOKUP('Cotización'!$H$7,${RNG},${col},1)/VLOOKUP(MAX(K${i},'Índices'!$A$2),${RNG},${col},1),1)` },
          { f: `F${i}*N${i}` }, { f: `D${i}*O${i}` }, COINC[s.coincide] || "", s.diferencia || "", ...(esSrv ? [] : [Motor.esTaval(it) ? "sí" : ""])];
        vals.forEach((v, j) => {
          const c = j + 1;
          const st = c === 4 || c === 6 ? INP : c === 8 ? { fill: { fgColor: { rgb: TF[s.tipo] || "FFFFFF" } } } :
            c === 17 ? { fill: { fgColor: { rgb: { igual: "DDF1E4", similar: "FBEFD6", sin_ref: "F8E1DE" }[s.coincide] || "FFFFFF" } } } : null;
          const z = [6, 7, 15, 16].includes(c) ? U : { 11: "dd-mm-yyyy", 13: "0.0", 14: "0.000" }[c];
          put(w, A(c, i), v, st, z);
        });
      });
      const n = items.length + 2;
      put(w, A(3, n), `Subtotal por ${eq.singular}`, TOT);
      put(w, A(7, n), { f: `SUM(G2:G${n - 1})` }, TOT, U); put(w, A(16, n), { f: `SUM(P2:P${n - 1})` }, TOT, U);
      let k = n + 2;
      for (const it of items) for (const a of it.fuentes.slice(1)) put(w, A(3, k++), `Alternativa pos ${it.pos}: USD ${a.precio} · ${a.proveedor} · ${a.origen} · ${fecha(a.fecha)} (${TIPOS[a.tipo]})`, GRIS);
      w["!autofilter"] = { ref: `A1:R${Math.max(2, n - 1)}` };
      X.utils.book_append_sheet(wb, w, nombre);
    };
    detalle("Materiales", mat, false);
    detalle("MO y servicios", srv, true);

    const x = hoja();
    cabecera(x, ["Mes", "IPC Argentina (oct-24=100)", "Dólar BNA vendedor (promedio)", "Costo local en USD (IPC/dólar, oct-24=100)", "CPI EE.UU. (oct-24=100)", "Origen IPC", "Origen dólar", "Origen CPI"],
      [11, 13, 12, 16, 12, 40, 40, 40]);
    idx.forEach((r, k) => {
      const i = k + 2;
      put(x, A(1, i), serial(r.mes + "-01"), null, "mm-yyyy"); put(x, A(2, i), r.ipc, null, "0.00"); put(x, A(3, i), r.dolar, null, "#,##0.00");
      put(x, A(4, i), r.local, null, "0.00"); put(x, A(5, i), r.cpi, null, "0.00"); put(x, A(6, i), r.oi); put(x, A(7, i), r.od); put(x, A(8, i), r.oc);
    });
    X.utils.book_append_sheet(wb, x, "Índices");
    if ((cot.desvios || []).length) {
      const d = hoja(); cabecera(d, ["Pos", "Desvío", "Detalle"], [16, 50, 80]);
      cot.desvios.forEach((dv, k) => { put(d, A(1, k + 2), sinHtml(dv.tag)); put(d, A(2, k + 2), sinHtml(dv.titulo)); put(d, A(3, k + 2), sinHtml(dv.texto)); });
      X.utils.book_append_sheet(wb, d, "Desvíos");
    }
    return new Blob([X.write(wb, { type: "array", bookType: "xlsx" })], { type: "application/octet-stream" });
  }

  // ------------------------------------------------------------------ Excel para Compras
  // Igual que herramientas/lista_compras.py (pedido de Matías, 28-10-2026): la lista TAL CUAL el documento de origen
  // (cot.transcripcion: tablas con sus columnas y su texto), a la derecha la cantidad a comprar calculada (m, kg o un),
  // los kg aproximados y de dónde sale la cantidad; después Proveedor, Precio, Plazo y Anotaciones para Compras.
  // Lo que se compra y no está en el documento va aparte; los precios de referencia, en otra hoja (uso interno).
  function compras(cot) {
    const X = XLSX, wb = X.utils.book_new(), N = Number(cot.parametros.N) || 1;
    const est = (rgb, bold, color) => ({ font: { bold: !!bold, color: { rgb: color || "000000" } }, fill: { fgColor: { rgb } }, alignment: { wrapText: true, vertical: "top" } });
    const AZ = est("1D5F86", true, "FFFFFF"), GR = est("5D6B75", true, "FFFFFF"), OC = est("B7791F", true, "FFFFFF"), CG = est("EEF3F6"), CA = est("FBEFD6");
    const mats = cot.items.filter(i => i.grupo === "material");
    const esTira = it => /^(completar|sobrante)/i.test(String(it.descripcion || "").trim());
    const kgU = cot.kg_compras || {};
    const eqTxt = N === 1 ? (cot.equipo?.singular || "equipo") : (cot.equipo?.plural || "equipos");
    const tr = cot.transcripcion || { fuente: "Cotización de la página (no hay transcripción literal del documento)", tablas: [{
      titulo: "LISTA DE MATERIALES", columnas: ["Pos", "Descripción", "Ø", "Serie / SCH", "Material", "Marca / modelo", "Cant.", "Unidad"],
      filas: mats.filter(i => !esTira(i) && !/[a-z]$/i.test(String(i.pos))).map(i => { const p = i.plano || {};
        return [i.pos, p.descripcion || i.descripcion, p.diametro || "", p.serie_sch || "", p.material || "", p.modelo || "", i.cantidad, i.unidad]; }) }] };
    const enDoc = new Set(tr.tablas.flatMap(t => t.filas.map(f => String(f[0]).trim())));
    const filas = [[`PEDIDO DE COTIZACIÓN DE MATERIALES · ${cot.codigo}`], [`${cot.titulo || ""} · ${N} ${eqTxt}`], ["Origen de la lista", tr.fuente]];
    const estilos = {};
    const marca = (r, c, s) => { estilos[X.utils.encode_cell({ r, c })] = s; };
    let kgTot = 0;
    for (const t of tr.tablas) {
      filas.push([], [t.titulo]);
      const cab = [...t.columnas, "Cant. a comprar", "Unidad", "Kg aprox.", "Origen de la cantidad", "Proveedor", "Precio unit. USD", "Plazo", "Anotaciones"];
      const rc = filas.length; filas.push(cab);
      cab.forEach((_, c) => marca(rc, c, c < t.columnas.length ? AZ : c < t.columnas.length + 4 ? GR : OC));
      for (const f of t.filas) {
        const pos = String(f[0]).trim(), its = mats.filter(i => String(i.pos).trim() === pos);
        const extras = mats.filter(i => esTira(i) && new RegExp("^" + pos.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[b-z]$").test(String(i.pos).trim()));
        let calc = ["—", "", "", "no se cotiza"];
        if (its.length) {
          const q = its.reduce((a, i) => a + Number(i.cantidad), 0) * N, qe = extras.reduce((a, i) => a + Number(i.cantidad), 0) * N, u = its[0].unidad;
          const k = kgU[pos] != null ? Math.round(kgU[pos] * (q + qe) * 10) / 10 : "—";
          if (typeof k === "number") kgTot += k;
          const desc = its[0].plano?.descripcion || "";
          calc = [Math.round((q + qe) * 1000) / 1000, u, k, qe ? `${q} ${u} para ${N} ${eqTxt} + ${qe} ${u} para completar la tira`
            : /medida del dibujo|no indica/i.test(desc) ? "el documento no da cantidad: medida del dibujo (±20%)" : N === 1 ? "documento" : `documento × ${N}`];
        }
        const r = filas.length; filas.push([...f, ...calc, "", "", "", ""]);
        for (let c = t.columnas.length; c < t.columnas.length + 8; c++) marca(r, c, c < t.columnas.length + 4 ? CG : CA);
      }
    }
    if (tr.nota) filas.push(["", "Nota del documento: " + tr.nota]);
    const adic = mats.filter(i => !enDoc.has(String(i.pos).trim()) && !esTira(i));
    if (adic.length) {
      filas.push([], ["ADICIONALES (no figuran en el documento; los agrega ITT)"]);
      const cab = ["Pos", "Descripción", "Especificación", "Cant. a comprar", "Unidad", "Kg aprox.", "Por qué", "Proveedor", "Precio unit. USD", "Plazo", "Anotaciones"];
      const rc = filas.length; filas.push(cab); cab.forEach((_, c) => marca(rc, c, c < 7 ? GR : OC));
      for (const i of adic) { const r = filas.length; filas.push([i.pos, i.descripcion, i.especificacion || "", Number(i.cantidad) * N, i.unidad, "—", "compra mínima o nota del documento", "", "", "", ""]);
        for (let c = 7; c < 11; c++) marca(r, c, CA); }
    }
    filas.push([], [`Peso aproximado de lo que tiene tabla: ${Math.round(kgTot)} kg`],
      ["Columnas azules: tal cual el documento. Grises: cálculo de ITT. Amarillas: para que Compras complete (proveedor, precio sin IVA, plazo y anotaciones)."]);
    const ws = X.utils.aoa_to_sheet(filas);
    for (const [a, s] of Object.entries(estilos)) { ws[a] = ws[a] || { t: "s", v: "" }; ws[a].s = s; }
    ws.A1.s = { font: { bold: true, sz: 14, color: { rgb: "1D5F86" } } };
    ws["!cols"] = [6, 46, 9, 8, 8, 8, 20, 11, 8, 10, 30, 22, 13, 12, 45].map(w => ({ wch: w }));
    X.utils.book_append_sheet(wb, ws, "Materiales");
    const serv = cot.items.filter(i => i.grupo !== "material");
    const sv = X.utils.aoa_to_sheet([["Servicio", "Aclaraciones", "Proveedor", "Precio unit. USD", "Plazo", "Anotaciones"], ...serv.map(i => [i.descripcion, i.especificacion || "", "", "", "", ""])]);
    sv["!cols"] = [50, 45, 22, 13, 12, 45].map(w => ({ wch: w }));
    X.utils.book_append_sheet(wb, sv, "Servicios");
    const ref = X.utils.aoa_to_sheet([["Pos", "Descripción", "Proveedor de referencia", "Último precio USD", "Fecha", "Tipo", "Coincide", "Diferencia"],
      ...cot.items.map(i => { const s = i.fuentes[0]; return [i.pos, i.descripcion, s.proveedor, Number(s.precio) || "SIN PRECIO", fecha(s.fecha), TIPOS[s.tipo] || s.tipo, COINC[s.coincide] || s.coincide || "", s.diferencia || ""]; }),
      [], ["Uso interno: no mandar al proveedor."]]);
    ref["!cols"] = [7, 45, 40, 13, 11, 12, 12, 50].map(w => ({ wch: w }));
    X.utils.book_append_sheet(wb, ref, "Referencias internas");
    return new Blob([X.write(wb, { type: "array", bookType: "xlsx" })], { type: "application/octet-stream" });
  }

  // ------------------------------------------------------------------ PDF desde HTML (html2pdf)
  async function pdfDeHtml(html) {
    const caja = document.createElement("div");
    caja.style.cssText = "position:fixed;left:-10000px;top:0;width:718px;background:#fff;color:#1b2730";
    caja.innerHTML = html;
    document.body.appendChild(caja);
    try {
      return await html2pdf().set({
        margin: [10, 10, 12, 10], image: { type: "jpeg", quality: 0.95 }, html2canvas: { scale: 2, useCORS: true, backgroundColor: "#ffffff" },
        jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }, pagebreak: { mode: ["css", "legacy"], avoid: ["tr", ".nobreak"] }
      }).from(caja.firstElementChild).outputPdf("blob");
    } finally { caja.remove(); }
  }

  // ------------------------------------------------------------------ Ofertas (Word con la plantilla de ITT)
  const r_ = (texto, o = {}) => {
    const tam = Math.round((o.tam || 10) * 2), color = o.color || "002060";
    return `<w:r><w:rPr><w:rFonts w:ascii="Aptos" w:hAnsi="Aptos"/>${o.negrita ? "<w:b/>" : ""}${o.italica ? "<w:i/>" : ""}<w:color w:val="${color}"/><w:sz w:val="${tam}"/>${o.resaltar ? '<w:highlight w:val="yellow"/>' : ""}</w:rPr><w:t xml:space="preserve">${esc(texto)}</w:t></w:r>`;
  };
  const marcadores = (texto, o = {}) => String(texto ?? "").split(/(\[[^\]]+\])/).filter(Boolean).map(t => r_(t, { ...o, resaltar: t.startsWith("[") })).join("");
  const cm = v => Math.round(v * 567);

  function cuerpoOferta(tipo, ctx) {
    const { of, cot, calc, tituloXml, plano } = ctx;
    let x = "";
    const p = (runs, o = {}) => `<w:p><w:pPr>${o.keep ? "<w:keepNext/>" : ""}<w:spacing w:after="${o.after ?? 80}"/><w:ind w:left="${cm(o.sangria ?? 0.75)}"${o.colgante ? ` w:hanging="${cm(o.colgante)}"` : ""}/><w:jc w:val="${o.jc || "both"}"/></w:pPr>${runs}</w:p>`;
    const vacio = () => "<w:p/>";
    const titulo = t => {
      let xml = tituloXml.replace(/ w14:(paraId|textId)="[^"]*"/g, "");
      let primero = true;
      xml = xml.replace(/(<w:t(?: [^>]*)?>)([^<]*)(<\/w:t>)/g, (m, a, b, c) => { const v = primero ? esc(t) : ""; primero = false; return `<w:t xml:space="preserve">${v}</w:t>`; });
      xml = xml.replace("</w:pPr>", "<w:keepNext/></w:pPr>");
      return xml + p("", { keep: true, after: 0 });
    };
    const texto = (t, o = {}) => p(marcadores(t, { negrita: o.negrita }), { sangria: o.sangria ?? 0.75 });
    const vinetas = items => items.map(t => p(r_("•  ") + marcadores(t), { sangria: 1.25, colgante: 0.4, jc: "left", after: 40 })).join("");
    const tabla = (cab, filas, anchos, total, tam = 9, alinear) => {
      const borde = ["top", "left", "bottom", "right", "insideH", "insideV"].map(l => `<w:${l} w:val="single" w:sz="4" w:color="002060"/>`).join("");
      const celda = (t, w, o = {}) => `<w:tc><w:tcPr><w:tcW w:w="${cm(w)}" w:type="dxa"/>${o.span ? `<w:gridSpan w:val="${o.span}"/>` : ""}${o.cab ? '<w:shd w:val="clear" w:color="auto" w:fill="002060"/>' : ""}<w:vAlign w:val="center"/></w:tcPr><w:p><w:pPr><w:spacing w:after="0"/><w:jc w:val="${o.jc || "center"}"/></w:pPr>${marcadores(t, { negrita: o.cab || o.negrita, tam, color: o.cab ? "FFFFFF" : "002060" })}</w:p></w:tc>`;
      let t = `<w:tbl><w:tblPr><w:jc w:val="center"/><w:tblBorders>${borde}</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>${anchos.map(a => `<w:gridCol w:w="${cm(a)}"/>`).join("")}</w:tblGrid>`;
      t += `<w:tr>${cab.map((h, i) => celda(h, anchos[i], { cab: true })).join("")}</w:tr>`;
      for (const f of filas) t += `<w:tr>${f.map((v, i) => celda(v, anchos[i], { jc: (alinear || [])[i] === 0 ? "left" : "center" })).join("")}</w:tr>`;
      if (total) {
        const n = cab.length, span = n - 2;
        t += `<w:tr>${celda(total[0], anchos.slice(0, span).reduce((a, b) => a + b, 0), { span, negrita: true })}${celda(total[1], anchos[n - 2], { negrita: true })}${celda("", anchos[n - 1])}</w:tr>`;
      }

    const natural = (a, b) => (parseFloat(a.pos) || 9e9) - (parseFloat(b.pos) || 9e9) || String(a.pos).localeCompare(String(b.pos));
    const ord = { pos: natural, importe: (a, b) => imp(b.id) - imp(a.id), desc: (a, b) => a.descripcion.localeCompare(b.descripcion), fecha: (a, b) => String(a.fuentes[0].fecha).localeCompare(String(b.fuentes[0].fecha)) }[v.o];
    let items = todos.filter(pasa); if (ord) items = [...items].sort(ord);
    const k = grupoMat ? "m" : "s";
    const controles = todos.length ? `<div class="fila filtros-items"><label><span>Mostrar</span><select id="fi-${k}" data-vi="${k}" data-c="f">${FILTROS.map(([x, n]) => `<option value="${x}" ${v.f === x ? "selected" : ""}>${n}</option>`).join("")}</select></label>
      <label><span>Ordenar</span><select id="oi-${k}" data-vi="${k}" data-c="o">${ORDENES.map(([x, n]) => `<option value="${x}" ${v.o === x ? "selected" : ""}>${n}</option>`).join("")}</select></label>
      <span class="small muted">${items.length} de ${todos.length} ítem(s)</span></div>` : "";
    const celdaAvisos = it => { const a = porItem[it.id]; if (!a) return `<span class="muted small">—</span>`;
      const bad = a.some(x => x.nivel === "bad");
      return `<details class="avs ${bad ? "bad" : "warn"}"><summary title="${E(a.map(x => x.corto).join(" · "))}">${bad ? "✖" : "⚠"} ${a.length}</summary><ul>${a.map(x => `<li>${E(x.corto)}</li>`).join("")}</ul></details>`; };
    if (todos.length && !items.length) return controles + `<div class="vacio">Ningún ítem con ese filtro.</div>`;
    if (!items.length) return `<div class="vacio">${grupoMat ? "Todavía no hay materiales. Buscalos abajo en el catálogo y agregalos, o cargá uno a mano." : "Todavía no hay mano de obra ni servicios. Buscalos en el catálogo o usá las calculadoras."}</div>`;
    const cl = s => s.coincide === "igual" ? "ok" : s.coincide === "similar" ? "warn" : "bad";
    return controles + `<div class="tbl"><table><thead><tr><th>Pos</th><th>Ítem</th><th class="n">Cant.</th><th>Un.</th><th class="n">USD unit.</th><th>Fuente</th><th>Coincide</th><th>Avisos</th><th class="n">USD ajustado</th><th></th></tr></thead><tbody>
      ${items.map(it => { const s = it.fuentes[0]; return `<tr>
        <td class="ed" style="width:60px"><input id="p-${E(it.id)}" data-it="${E(it.id)}" data-c="pos" value="${E(it.pos)}" style="width:52px"></td>
        <td><div class="d">${E(it.descripcion)}</div><div class="sp">${E(it.especificacion || "")}</div></td>
        <td class="ed"><input id="q-${E(it.id)}" type="text" inputmode="decimal" class="num" data-it="${E(it.id)}" data-c="cantidad" value="${NI(it.cantidad)}"></td><td>${E(it.unidad)}</td>
        <td class="ed"><input id="u-${E(it.id)}" type="text" inputmode="decimal" class="num" data-it="${E(it.id)}" data-c="precio" value="${NI(s.precio)}"></td>
        <td class="small"><span class="pill ${s.tipo === "est" ? "bad" : s.tipo === "cot" ? "ok" : "info"}">${E(Documentos.TIPOS[s.tipo] || s.tipo)}</span><br>${E(s.proveedor)}<br><span class="muted">${E(F(s.fecha))}</span></td>
        <td><span class="pill ${cl(s)}">${E(Documentos.COINC[s.coincide] || "—")}</span>${s.diferencia ? `<div class="sp">${E(s.diferencia.slice(0, 140))}</div>` : ""}</td>
        <td>${celdaAvisos(it)}</td>
        <td class="n" data-sub="${E(it.id)}">${num(c.filas.find(f => f.id === it.id)?.ajustado)}</td>
        <td><div class="fila fin"><button class="chico" data-a="editar" data-id="${E(it.id)}">Editar</button><button class="chico peligro" data-a="quitar" data-id="${E(it.id)}">Quitar</button></div></td></tr>`; }).join("")}
      <tr class="total"><td></td><td>Subtotal por ${E(S.doc.cot.equipo?.singular || "equipo")} (con ajuste por inflación${items.length < todos.length ? ", todos los ítems" : ""})</td><td colspan="6"></td><td class="n" data-subtot="${grupoMat ? "material" : "srv"}"></td><td></td></tr></tbody></table></div>`;

  // Detallado o global por rubro (Rubros, rubros.js): la ficha junta los datos para pedir el global al tercero y controlarlo
  function panelRubros() {
    const cot = S.doc.cot, f = Rubros.ficha(cot, S.datos, S.sold, Motor), eq = E(cot.equipo?.singular || "equipo");
    const origen = f.aproximada ? "Ficha aproximada de la página (sin la tabla del plano: faltan juntas y placas; la completa la arma Claude Code con el plano)."
      : `Ficha calculada con la tabla del plano el ${E(F(f.generada))}. Si cambiaste materiales después, pedí que la rearmen.`;
    const tarjeta = r => {
      const [nombre] = Rubros.RUBROS[r], glob = Rubros.modo(cot, r) === "global", g = Rubros.globalDe(cot, r), s = g?.fuentes[0], tr = r === "transporte";
      return `<div class="panel rubro"><div class="sec-head"><h3>${E(nombre)}</h3><div class="estados" role="group" aria-label="Modo de ${E(nombre)}">
          <button class="chico" data-a="rubro-modo" data-r="${r}" data-v="detallado" aria-pressed="${!glob}">${tr ? "Sin precio (EXW)" : "Detallado"}</button>
          <button class="chico" data-a="rubro-modo" data-r="${r}" data-v="global" aria-pressed="${glob}">Global</button></div></div>
        ${tr ? `<div class="campos">${campo("Largo (m)", "cot.transporte.largo_m", "number")}${campo("Ancho (m)", "cot.transporte.ancho_m", "number")}${campo("Alto (m)", "cot.transporte.alto_m", "number")}${campo("Destino", "cot.transporte.destino")}</div>` : ""}
        <div id="rd-${r}">${fichaRubro(f, r)}</div>
        ${glob ? `<div class="campos">
          ${tr ? `<label><span>USD por viaje (sin IVA)</span><input id="gv-${r}" type="text" inputmode="decimal" class="num" data-glob="${r}" data-c="viaje" value="${NI(g.viaje_usd ?? "")}"></label>`
               : `<label><span>Precio global USD por ${eq} (sin IVA)</span><input id="gp-${r}" type="text" inputmode="decimal" class="num" data-glob="${r}" data-c="precio" value="${NI(s.precio)}"></label>`}
          <label><span>Proveedor</span><input id="gr-${r}" data-glob="${r}" data-c="proveedor" value="${E(s.proveedor)}"></label>
          <label><span>Fecha de la cotización</span><input id="gf-${r}" data-glob="${r}" data-c="fecha" type="text" inputmode="numeric" placeholder="DD-MM-AAAA" value="${E(F(s.fecha))}"></label>
          <label class="ancho"><span>Documento (cotización, mail, archivo)</span><input id="go-${r}" data-glob="${r}" data-c="origen" value="${E(s.origen)}"></label></div>
          <p class="small" id="rg-${r}">${globalRubro(f, r)}</p>` : ""}
        <div class="fila"><button class="chico" data-a="ficha-copiar" data-r="${r}">Copiar ficha</button><button class="chico" data-a="ficha-bajar" data-r="${r}" ${S.dl ? "" : "disabled"}>Descargar ficha (.txt)</button></div></div>`;
    };
    return `<section><div class="sec-head"><h2>Cotizar por rubro: detallado o global</h2><span class="eyebrow">todo por ${eq} · la cantidad multiplica al final</span></div>
      <p class="small muted">Detallado: como hasta ahora. Global: un solo precio del tercero por rubro; los renglones detallados quedan guardados y vuelven al pasar a detallado. ${origen}</p>
      <div class="grid-rubros">${Object.keys(Rubros.RUBROS).map(tarjeta).join("")}</div></section>`;
  }
  const uniRubro = (f, r, usd) => Rubros.unitarios(f, r, usd).map(([u, x]) => `USD ${num(x)}/${E(u)}`).join(" · ");
  function fichaRubro(f, r) {
    const ref = f.referencias[r], glob = ref.modo === "global", eq = E(S.doc.cot.equipo?.singular || "equipo");
    const v = x => x == null || x === "" ? '<span class="muted">—</span>' : typeof x === "number" ? num(x, Number.isInteger(x) ? 0 : 2) : E(x);
    return `<table class="ficha"><tbody>${Rubros.datosDe(f, r).map(([e, x, u]) => `<tr><td>${E(e)}</td><td${typeof x === "number" ? ' class="n"' : ""}>${v(x)}${u && x != null ? " " + E(u) : ""}</td></tr>`).join("")}</tbody></table>
      ${(f[r].avisos || []).map(a => `<div class="small warn">⚠ ${E(a)}</div>`).join("")}
      ${r === "transporte" ? "" : `<p class="small">Cálculo detallado: <b>USD ${num(ref.detallado_usd)}</b> por ${eq} (${ref.renglones_detalle} renglón/es${glob ? ", guardados" : ""})${ref.detallado_usd ? " · " + uniRubro(f, r, ref.detallado_usd) : ""}</p>`}`;
  }
  function globalRubro(f, r) {
    const ref = f.referencias[r], g = Rubros.globalDe(S.doc.cot, r); if (!g) return "";

  // ------------------------------------------------------------------ pestaña Plazo
  function tabPlazo() {
    const pl = S.doc.cot.plazo ??= { dias: 60, texto: "desde OC", tareas: [], nota: "" };
    pl.tareas ??= [];
    const mat = pl.tareas.filter(t => t[3] !== "tal"), tal = pl.tareas.filter(t => t[3] === "tal");
    const acopio = Math.max(0, ...mat.map(t => +t[2] || 0)), taller = tal.reduce((a, t) => a + ((+t[2] || 0) - (+t[1] || 0)), 0);
    const calcD = acopio + taller, m1 = Math.round(calcD * 1.15), m2 = Math.round(calcD * 1.2);
    const solapa = tal.find(t => +t[1] < acopio);
    let aviso = "";
    if (pl.dias < calcD) aviso = `<div class="aviso bad">El plazo ofrecido (${pl.dias} d) es menor que el calculado (${calcD} d).</div>`;
    else if (pl.dias < m1) aviso = `<div class="aviso">El plazo ofrecido (${pl.dias} d) no tiene el margen de 15–20% (sugerido ${m1}–${m2} d).</div>`;
    if (solapa) aviso += `<div class="aviso bad">Superposición: "${E(solapa[0])}" empieza el día ${solapa[1]}, antes de que llegue el material más largo (día ${acopio}).</div>`;
    return `<div class="grid2"><section class="panel"><h3>Plazo ofrecido</h3><div class="campos">${campo("Días", "cot.plazo.dias", "number")}${campo("Desde", "cot.plazo.texto")}
        <label class="ancho"><span>Nota (aparece en el informe)</span><textarea id="f-plazo-nota" data-b="cot.plazo.nota">${E(pl.nota || "")}</textarea></label></div></section>
      <section class="panel"><h3>Plazo calculado</h3><p>Material más largo: <b>${acopio} días</b> · taller, ensayos y despacho: <b>${taller} días</b>.</p>
        <p>Sin superponer: <b>${calcD} días</b> · con el margen de 15–20%: <b>${m1}–${m2} días</b>.</p>${aviso}
        <p class="small muted">Los plazos típicos de cada rubro están en el catálogo de plazos de proveedores (válvulas esféricas ~90 d, control ~94, PSV ~100, instrumentos ~85–90). Cargá el plazo que cotizó cada proveedor.</p></section></div>
      <section><div class="sec-head"><h3>Tareas</h3><button class="chico" data-a="tarea-nueva">Agregar tarea</button></div>
        ${pl.tareas.length ? `<div class="tbl"><table><thead><tr><th>Tarea</th><th class="n">Día inicio</th><th class="n">Día fin</th><th>Tipo</th><th></th></tr></thead><tbody>
        ${pl.tareas.map((t, i) => `<tr><td><input id="tn-${i}" data-ta="${i}" data-c="0" value="${E(t[0])}"></td><td class="ed"><input id="ti-${i}" type="text" inputmode="decimal" class="num" data-ta="${i}" data-c="1" value="${NI(t[1])}"></td>
          <td class="ed"><input id="tf-${i}" type="text" inputmode="decimal" class="num" data-ta="${i}" data-c="2" value="${NI(t[2])}"></td>
          <td><select id="tt-${i}" data-ta="${i}" data-c="3"><option value="" ${t[3] === "" ? "selected" : ""}>material</option><option value="crit" ${t[3] === "crit" ? "selected" : ""}>material crítico</option><option value="tal" ${t[3] === "tal" ? "selected" : ""}>taller / despacho</option></select></td>
          <td><button class="chico peligro" data-a="tarea-quitar" data-i="${i}">Quitar</button></td></tr>`).join("")}</tbody></table></div>` : `<div class="vacio">Sin tareas. Agregá una por cada material de plazo largo y las etapas de taller.</div>`}</section>`;
  }

      : `<label><span>${etq}</span><input id="ei-${k}" data-ei="${k}" type="text" ${tipo === "number" ? 'inputmode="decimal" class="num" data-num' : ""} value="${E(tipo === "number" ? NI(v) : (v ?? ""))}"></label>`;
    capa.hidden = false;
    capa.innerHTML = `<div class="capa"><section class="panel" role="dialog" aria-label="Ítem"><h2>${nuevo ? "Cargar ítem a mano" : "Editar ítem"}</h2>
      <div class="campos">${inp("pos", "Posición del plano", it.pos)}<label><span>Grupo</span><select id="ei-grupo" data-ei="grupo">${[["material", "Material"], ["mo", "Mano de obra"], ["servicio", "Servicio"]].map(([v, n]) => `<option value="${v}" ${it.grupo === v ? "selected" : ""}>${n}</option>`).join("")}</select></label>
        <label class="ancho"><span>Descripción</span><input id="ei-descripcion" data-ei="descripcion" value="${E(it.descripcion)}"></label>
        <label class="ancho"><span>Especificación</span><input id="ei-especificacion" data-ei="especificacion" value="${E(it.especificacion || "")}"></label>
        ${inp("cantidad", "Cantidad por equipo", it.cantidad, "number")}${inp("unidad", "Unidad", it.unidad)}
        ${it.grupo === "material" ? `<label><span>Válvula Taval</span><select id="ei-taval" data-ei="taval"><option value="" ${it.taval ? "" : "selected"}>No</option><option value="1" ${it.taval ? "selected" : ""}>Sí (usa el factor de válvulas Taval)</option></select></label>` : ""}
        ${it.grupo === "material" ? ["diametro", "serie_sch", "material", "extremos", "modelo"].map(k => inp("plano." + k, { diametro: "Ø (plano)", serie_sch: "Serie / sch (plano)", material: "Material (plano)", extremos: "Extremos (plano)", modelo: "Modelo / fabricante (plano)" }[k], it.plano[k])).join("") : ""}
      </div><h3>Precio y fuente (sin IVA)</h3><div class="campos">
        ${inp("f.precio", "Precio unitario USD sin IVA", s.precio, "number")}
        <label><span>Tipo de origen</span><select id="ei-ftipo" data-ei="f.tipo">${Object.entries(Documentos.TIPOS).map(([k, n]) => `<option value="${k}" ${s.tipo === k ? "selected" : ""}>${n}</option>`).join("")}</select></label>
        ${inp("f.proveedor", "Proveedor o criterio", s.proveedor)}${inp("f.fecha", "Fecha del precio", s.fecha, "date")}
        <label class="ancho"><span>Origen (carpeta, archivo o cotización)</span><input id="ei-forigen" data-ei="f.origen" value="${E(s.origen || "")}"></label>
        <label><span>¿Coincide con el plano?</span><select id="ei-fcoincide" data-ei="f.coincide">${Object.entries(Documentos.COINC).map(([k, n]) => `<option value="${k}" ${s.coincide === k ? "selected" : ""}>${n}</option>`).join("")}</select></label>
        <label class="ancho"><span>En qué difiere (obligatorio si es similar)</span><input id="ei-fdiferencia" data-ei="f.diferencia" value="${E(s.diferencia || "")}"></label></div>
      <p class="small muted">Si la cotización del proveedor dice "con IVA", dividí por 1,21 (o 1,105) antes de cargarla. Un valor verbal o "aprox" va como Estimado.</p>
      <p class="err" id="ei-err"></p><div class="fila fin"><button data-a="cerrar">Cancelar</button><button class="prim" data-a="item-guardar">Guardar</button></div></section></div>`;
  }

  // ------------------------------------------------------------------ cambio de estado (con controles; la herramienta nunca envía nada)
  function dialogoEstado(d) {
    const cot = S.doc.cot, malos = Busqueda.avisos(cot).filter(a => a.nivel === "bad"), act = cot.estado;
    let error = "", texto = "", extra = "";
    if (d === act) return;
    if (d === "revisado") {
      if (malos.length) error = `Hay ${malos.length} aviso(s) para corregir. Corregilos antes de pasar a revisado (ver Resumen y descargas).`;
      texto = "Confirmá que una persona revisó el cómputo contra el plano (procedimiento P10) y que los avisos para revisar están explicados.";
    } else if (d === "aprobado") {
      if (act !== "revisado") error = "Primero tiene que estar revisada.";
      else if (malos.length) error = `Hay ${malos.length} aviso(s) para corregir.`;
      texto = "Al aprobar, la oferta sale sin la leyenda de borrador y con la firma, y la cotización queda bloqueada para cambios.";
      extra = `<label><span>¿Quién aprueba? (Matías o la dirección)</span><input id="ap-por" autocomplete="off"></label>`;
    } else if (d === "enviado") {
      if (act !== "aprobado") error = "Solo se marca enviada una cotización aprobada.";
      texto = "La herramienta no envía nada. Marcala como enviada solo si ya la mandaste vos al cliente.";
    } else if (d === "borrador") {
      texto = act === "revisado" ? "Vuelve a borrador para seguir cambiándola." : "Vuelve a borrador: se desbloquea, se borra la aprobación y la oferta vuelve a salir con la leyenda de borrador.";
    }
    capa.hidden = false;
    capa.innerHTML = `<div class="capa"><section class="panel" role="dialog" aria-label="Cambiar estado"><h2>Pasar a "${E(d)}"</h2>
      ${error ? `<div class="aviso bad">${E(error)}</div>` : `<p>${E(texto)}</p>${extra}`}
      <p class="err" id="est-err"></p><div class="fila fin"><button data-a="cerrar">${error ? "Volver" : "Cancelar"}</button>
      ${error ? "" : `<button class="prim" data-a="estado-ok" data-v="${E(d)}">Pasar a ${E(d)}</button>`}</div></section></div>`;
    $("#ap-por")?.focus();
  }

  // ------------------------------------------------------------------ eventos
  app.addEventListener("input", ev => {
    const el = ev.target;
    if (bloqueada() && (el.dataset.b || el.dataset.bl || el.dataset.it || el.dataset.glob || el.dataset.ta !== undefined)) {
      toast(`La cotización está ${S.doc.cot.estado}: para cambiarla, volvé a borrador.`); render(); return;
    }
    if (el.dataset.b && S.doc) {
      let v = el.value;
      if (el.dataset.t === "fecha") { v = Documentos.isoDe(v); el.classList.toggle("mal", !v); if (!v) return; }
      if (el.dataset.t === "number") { v = v.trim() === "" ? (el.dataset.b === "cot.parametros.FTV" ? 1 : 0) : NUM(v); el.classList.toggle("mal", v == null); if (v == null) return; }
      ponerRuta(S.doc, el.dataset.b, v);
      if (el.dataset.b === "cot.estado") S.doc.oferta.estado = v;
      if (el.dataset.b.startsWith("cot.transporte")) { precioTransporte(); pintarRubros(); }
      refrescar(); guardarPronto();
      if (el.tagName === "SELECT" || el.dataset.b.startsWith("cot.plazo")) { if (el.tagName === "SELECT" || ev.type === "change") render(); }
    } else if (el.dataset.bl && S.doc) {
      ponerRuta(S.doc, el.dataset.bl, el.value.split("\n").map(x => x.trim()).filter(Boolean)); guardarPronto();
    } else if (el.dataset.it && S.doc) {
      const it = S.doc.cot.items.find(i => i.id === el.dataset.it);
      if (el.dataset.c === "precio" || el.dataset.c === "cantidad") {
        const v = el.value.trim() === "" ? 0 : NUM(el.value); el.classList.toggle("mal", v == null || v < 0); if (v == null || v < 0) return;
        if (el.dataset.c === "precio") it.fuentes[0].precio = v; else it.cantidad = v;
      }
      else it[el.dataset.c] = el.value;
      refrescar(); guardarPronto();
    } else if (el.dataset.fm !== undefined) {
      const k = el.dataset.fm; S.fm[k] = el.value;
      if (k === "fam") S.fm = { fam: el.value, texto: S.fm.texto };
      if (k === "texto") { clearTimeout(S.tBus); S.tBus = setTimeout(pintarResultadosMat, 200); }
      else { $("#bus-mat").outerHTML = buscadorMat(); pintarResultadosMat(); }
    } else if (el.dataset.vi) {
      S.vistaItems[el.dataset.vi][el.dataset.c] = el.value; render();
    } else if (el.dataset.selm !== undefined || el.dataset.sels !== undefined) {
      const m = el.dataset.selm !== undefined, i = +(m ? el.dataset.selm : el.dataset.sels), x = m ? S.ultMat[i] : S.ultSrv[i], cod = m ? x.r.c : x.c, sel = m ? S.selM : S.selS;
      if (el.checked) sel.set(cod, { x, q: NUM($((m ? "#qm-" : "#qs-") + i).value) || 1 }); else sel.delete(cod);
      el.closest(".resultado").classList.toggle("sel", el.checked); pintarBarraSel(m ? "m" : "s");
    } else if (/^q[ms]-\d+$/.test(el.id)) {
      const m = el.id[1] === "m", i = +el.id.slice(3), x = m ? S.ultMat[i] : S.ultSrv[i], sel = m ? S.selM : S.selS, cod = m ? x?.r.c : x?.c;
      if (sel.has(cod)) sel.get(cod).q = NUM(el.value) || 1;
    } else if (el.dataset.fs !== undefined) {
      S.fs[el.dataset.fs] = el.value; clearTimeout(S.tBus); S.tBus = setTimeout(pintarResultadosSrv, 200);
    } else if (el.dataset.sold !== undefined) {
      S.sold[+el.dataset.sold][el.dataset.c] = ["bw", "sw", "olet"].includes(el.dataset.c) ? String(NUM(el.value) ?? "") : el.value;
      const sol = Busqueda.soldadura(S.datos, S.sold), t = Busqueda.tarifa(S.datos, "soldadura", "soldadura piping");
      $("#sold-res").innerHTML = `<b>${num(sol.pulg, 2)} pulgadas equivalentes</b> × USD ${t ? num(t.valor) : "—"} = <b>USD ${num(sol.pulg * (t ? +t.valor : 0))}</b>`;
      $("#rx-info").textContent = `Usa las juntas a tope de Soldaduras: ${sol.placas_chicas} placas chicas y ${sol.placas_grandes} grandes al 100%.`;
      document.querySelector('[data-a="sold-agregar"]').disabled = !(sol.pulg && t);
      document.querySelector('[data-a="rx-agregar"]').disabled = !(sol.placas_chicas + sol.placas_grandes);
    } else if (el.dataset.glob && S.doc) {
      const r = el.dataset.glob, g = Rubros.globalDe(S.doc.cot, r); if (!g) return;
      const src = g.fuentes[0], c = el.dataset.c;
      if (c === "precio" || c === "viaje") {
        const v = el.value.trim() === "" ? 0 : NUM(el.value); el.classList.toggle("mal", v == null || v < 0); if (v == null || v < 0) return;
        if (c === "viaje") { g.viaje_usd = v; precioTransporte(); } else src.precio = v;
      } else if (c === "fecha") { const v = Documentos.isoDe(el.value); el.classList.toggle("mal", !v); if (!v) return; src.fecha = v; }
      else src[c] = el.value;
      if ((c === "precio" || c === "viaje") && src.precio && src.tipo === "est" && /^SIN PRECIO/.test(src.diferencia || "")) { src.tipo = "cot"; src.diferencia = ""; }
      refrescar(); pintarRubros(); guardarPronto();
    } else if (el.dataset.ta !== undefined) {
      const t = S.doc.cot.plazo.tareas[+el.dataset.ta], c = +el.dataset.c;
      t[c] = c === 1 || c === 2 ? NUM(el.value) || 0 : el.value; guardarPronto();
    } else if (el.id === "rx-pct") S.rxPct = NUM(el.value) || 0;
    else if (el.id === "pin-m2") S.pinM2 = el.value;
    else if (el.id === "ph-h") S.phH = el.value;
  });
  app.addEventListener("change", async ev => {
    const el = ev.target;
    if (el.dataset.ta !== undefined || (el.dataset.b || "").startsWith("cot.plazo") || el.dataset.b === "cot.firmante_id") { guardarPronto(); render(); }
    if (el.id === "o-plano" && el.files[0]) {
      try {
        const r = await S.assets.upload(el.files[0]);
        S.doc.oferta.imagen_plano_asset = r.id; S.doc.oferta.imagen_plano_url = r.url; guardarPronto(); render(); toast("Imagen del plano cargada");
      } catch (e) { toast("No se pudo subir la imagen: " + (e.message || e.code)); }
    }
  });
  capa.addEventListener("input", ev => {
    const el = ev.target;
    if (el.dataset.ff) S.editF[el.dataset.ff] = el.value;
    if (el.dataset.ei) {
      const k = el.dataset.ei, it = S.editI.it, s = it.fuentes[0];
      let v = el.value;
      if (el.dataset.num !== undefined) { v = NUM(el.value); el.classList.toggle("mal", v == null && el.value.trim() !== ""); v = v ?? 0; }
      if (el.dataset.fecha !== undefined) { v = Documentos.isoDe(el.value); el.classList.toggle("mal", !v); }
      if (k === "taval") { if (v) it.taval = true; else delete it.taval; }
      else if (k.startsWith("f.")) s[k.slice(2)] = v; else if (k.startsWith("plano.")) it.plano[k.slice(6)] = v; else it[k] = v;
      if (k === "grupo") editorItem(it, it.grupo);
    }
  });
  capa.addEventListener("change", async ev => {
    if (ev.target.id === "ff-img" && ev.target.files[0]) {
      try { const r = await S.assets.upload(ev.target.files[0]); S.editF.firma_asset = r.id; S.editF.firma_url = r.url; toast("Imagen de la firma cargada"); editorFirmante(S.editF); }
      catch (e) { $("#ff-err").textContent = "No se pudo subir la imagen: " + (e.message || e.code); }
    }
  });
  document.addEventListener("click", async ev => {
    const b = ev.target.closest("[data-a]"); if (!b) return;
    const a = b.dataset.a;
    try { await accion(a, b); } catch (e) { toast("Error: " + (e.message || e.code || e)); console.error(e); }
  });

  // Acciones que cambian la cotización: no se permiten si está aprobada o enviada (hay que volver a borrador)
  const CAMBIAN = new Set(["quitar", "editar", "manual", "item-guardar", "agregar-mat", "agregar-srv", "agregar-sel", "sold-agregar", "rx-agregar", "pin-agregar",
    "ph-agregar", "rubro-modo", "tarea-nueva", "tarea-quitar", "restaurar", "deshacer", "rehacer"]);
  const bloqueada = () => S.doc && ["aprobado", "enviado"].includes(S.doc.cot.estado);
  async function accion(a, b) {
    const cot = S.doc?.cot;
    if (CAMBIAN.has(a) && bloqueada()) { toast(`La cotización está ${cot.estado}: para cambiarla, volvé a borrador.`); return; }
    switch (a) {
      case "tab": S.tab = b.dataset.v; render(); break;
      case "deshacer": deshacer(); break;
      case "cat-tab": S.catTab = b.dataset.v; render(); break;
      case "vista": await vistaPrevia(b.dataset.v); break;
      case "uno-k": await descargarUno(b, b.dataset.k); break;
      case "rehacer": rehacer(); break;
      case "estado": dialogoEstado(b.dataset.v); break;
      case "incorporar": {
        if (b.dataset.ok !== "1") { b.dataset.ok = "1"; b.textContent = "¿Seguro? Incorporar"; setTimeout(() => { b.dataset.ok = ""; render(); }, 4000); return; }
        cot.base = { ...(cot.base || {}), pedida: hoy() }; guardarPronto(); render();
        try {
          await Asistente.crearPedido({ tipo: "incorporar_base", texto: `Incorporar ${cot.codigo} (${cot.titulo || ""}) a la base: catálogos, antecedentes y página.`, cot: S.id, files: [], mandar: true });
          toast("Pedido mandado a Claude Code: va a actualizar catálogos y antecedentes");
        } catch (e) { toast(e.message); }
        break;
      }
      case "estado-ok": {
        const d = b.dataset.v;
        if (d === "aprobado") {
          const por = ($("#ap-por")?.value || "").trim();
          if (!por) { $("#est-err").textContent = "Escribí quién aprueba."; return; }
          cot.aprobacion = { por, fecha: hoy() };
        }
        cambiarEstado(d); capa.hidden = true; capa.innerHTML = ""; guardarPronto(); render();
        toast(`Estado: ${d}`); break;
      }
      case "nueva": { const id = await crearCotizacion(); S.tab = "datos"; location.hash = "c-" + id; break; }
      case "duplicar": { const id = await duplicarCotizacion(b.dataset.id); if (!id) return; toast("Cotización duplicada"); location.hash = "c-" + id; break; }
      case "borrar":
        if (b.dataset.ok !== "1") { b.dataset.ok = "1"; b.textContent = "¿Seguro? Borrar"; setTimeout(() => { b.dataset.ok = ""; b.textContent = "Borrar"; }, 4000); return; }
        await borrarCotizacion(b.dataset.id); toast("Cotización borrada"); break;
      case "quitar": cot.items = cot.items.filter(i => i.id !== b.dataset.id); guardarPronto(); render(); break;
      case "editar": editorItem(cot.items.find(i => i.id === b.dataset.id)); break;
      case "manual": editorItem(null, b.dataset.g); break;
      case "cerrar": capa.hidden = true; capa.innerHTML = ""; break;
      case "item-guardar": {
        const { it, nuevo } = S.editI, s = it.fuentes[0];
        const err = !it.descripcion ? "Falta la descripción." : !s.proveedor ? "Falta el proveedor o criterio del precio." : !/^\d{4}-\d{2}-\d{2}$/.test(s.fecha) || s.fecha > hoy() ? "La fecha del precio no es válida." :
          s.coincide === "similar" && !s.diferencia ? "Si es similar, escribí en qué difiere." : "";
        if (err) { $("#ei-err").textContent = err; return; }
        if (nuevo) cot.items.push(it); else cot.items[cot.items.findIndex(i => i.id === it.id)] = it;
        capa.hidden = true; capa.innerHTML = ""; guardarPronto(); render(); break;
      }
      case "agregar-mat": {
        const x = S.ultMat[+b.dataset.i], it = agregarMaterialDe(x, NUM($("#qm-" + b.dataset.i).value) || 1);
        S.selM.delete(x.r.c); guardarPronto(); render(); toast(`Agregado: ${it.descripcion.slice(0, 50)}`); break;
      }
      case "agregar-sel": {
        const sel = b.dataset.k === "m" ? S.selM : S.selS, n = sel.size;
        for (const { x, q } of sel.values()) {
          if (b.dataset.k === "m") agregarMaterialDe(x, q); else cot.items.push(Busqueda.itemDeServicio(x, q, siguienteId("S")));
        }
        sel.clear(); guardarPronto(); render(); toast(`Agregados ${n} ítem(s) a la cotización`); break;
      }
      case "limpiar-sel": (b.dataset.k === "m" ? S.selM : S.selS).clear(); render(); break;
      case "agregar-srv": {
        const r = S.ultSrv[+b.dataset.i], q = NUM($("#qs-" + b.dataset.i).value) || 1;
        cot.items.push(Busqueda.itemDeServicio(r, q, siguienteId("S"))); S.selS.delete(r.c); guardarPronto(); render(); toast(`Agregado: ${r.s.slice(0, 50)}`); break;
      }
      case "limpiar-fm": S.fm = { fam: S.fm.fam }; render(); break;
      case "sold-fila": S.sold.push({ dn: "2", sch: "40", bw: "", sw: "", olet: "", tipoOlet: "cupla" }); render(); break;
      case "sold-quitar": S.sold.splice(+b.dataset.i, 1); if (!S.sold.length) S.sold.push({ dn: "2", sch: "40" }); render(); break;
      case "sold-agregar": agregarSoldaduras(S.sold); guardarPronto(); render(); toast("Soldaduras agregadas"); break;
      case "rx-agregar": {
        const pct = (S.rxPct ?? NUM($("#rx-pct").value)) || 0;
        if (!pct) { toast("Cargá el porcentaje de juntas a radiografiar"); return; }
        agregarRx(S.sold, pct); guardarPronto(); render(); toast("Radiografía agregada"); break;
      }
      case "pin-calc": { const m2 = m2Canos(); S.pinM2 = m2.toFixed(2); render(); toast(m2 ? `${num(m2)} m² de caños y niples (sin accesorios ni válvulas)` : "No hay caños con Ø, schedule y largo para calcular"); break; }
      case "pin-agregar": {
        const m2 = NUM($("#pin-m2").value);
        if (!m2 || !$("#pin-t").value) { toast("Cargá los m² y elegí la tarifa"); return; }
        agregarPintura(m2, $("#pin-t").value); guardarPronto(); render(); toast("Pintura agregada"); break;
      }
      case "rubro-modo": {
        const r = b.dataset.r;
        if (b.dataset.v === "global") { if (!Rubros.pasarAGlobal(cot, r, hoy())) return; toast(`${Rubros.RUBROS[r][0]}: global. Cargá el precio del tercero.`); }
        else { Rubros.volverADetallado(cot, r); toast(`${Rubros.RUBROS[r][0]}: detallado`); }
        guardarPronto(); render(); break;
      }
      case "ficha-copiar": case "ficha-bajar": {
        const r = b.dataset.r, t = Rubros.texto(cot, Rubros.ficha(cot, S.datos, S.sold, Motor), r, num);
        if (a === "ficha-copiar") { await navigator.clipboard.writeText(t); toast("Ficha copiada"); }
        else await S.dl.save({ filename: `${base()} - ficha ${r}.txt`, data: new Blob(["\ufeff" + t], { type: "text/plain;charset=utf-8" }) });
        break;
      }
      case "ph-agregar": agregarPH(NUM($("#ph-h").value) || 6); guardarPronto(); render(); toast("Prueba hidráulica agregada"); break;
      case "tarea-nueva": cot.plazo.tareas.push(["Nueva tarea", 0, 30, ""]); guardarPronto(); render(); break;
      case "tarea-quitar": cot.plazo.tareas.splice(+b.dataset.i, 1); guardarPronto(); render(); break;
      case "firmante-nuevo": editorFirmante(); break;
      case "firmante-editar": editorFirmante(S.firmantes.find(f => f.id === b.dataset.id)); break;
      case "firmante-guardar": {
        const f = S.editF;
        if (!f.nombre) { $("#ff-err").textContent = "Falta el nombre."; return; }
        const { id, ...resto } = f;
        await S.db.doc("firmantes/" + id).set(resto); capa.hidden = true; capa.innerHTML = ""; toast("Firmante guardado"); break;
      }
      case "ver-versiones": {
        const vs = await S.db.collection(`cotizaciones/${S.id}/versiones`).orderBy("guardado", "desc").limit(20).get();
        $("#versiones").innerHTML = vs.docs.length ? `<ul>${vs.docs.map(d => `<li>${FH(d.data().guardado)} · ${E(d.data().estado)} <button class="chico" data-a="restaurar" data-id="${E(d.id)}">Restaurar</button></li>`).join("")}</ul>` : "Todavía no hay versiones (se guarda una cada 10 minutos de trabajo y en cada cambio de estado).";
        break;
      }
      case "restaurar": {
        if (b.dataset.ok !== "1") { b.dataset.ok = "1"; b.textContent = "¿Seguro? Restaurar"; return; }
        const d = await S.db.doc(`cotizaciones/${S.id}/versiones/${b.dataset.id}`).get();
        S.doc.cot = clon(d.data().cot); S.doc.oferta = clon(d.data().oferta); S.ultVersion = 0; guardarPronto(); render(); toast("Versión restaurada"); break;
      }
      case "zip": await descargarTodo(b); break;

  async function prepararArchivo(file) {
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    if (file.size > MAX_MB * 1048576) throw new Error(`${file.name}: pesa más de ${MAX_MB} MB`);
    const tipos = { png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", webp: "image/webp", gif: "image/gif", pdf: "application/pdf",
      csv: "text/csv", txt: "text/plain", md: "text/markdown", json: "application/json" };
    if (tipos[ext]) return { blob: file, nombre: file.name, tipo: tipos[ext] };
    if (["xlsx", "xlsm", "xls", "ods"].includes(ext)) {

      const md = `# ${file.name}\n\nConvertido de Excel en la página (${new Date().toLocaleDateString("es-AR")}). Números en formato de máquina: el punto es decimal.\n\n${partes.join("\n\n")}\n`;
      return { blob: new Blob([md], { type: "text/markdown" }), nombre: file.name + ".md", tipo: "text/markdown", original: file.name };
    }
    if (ext === "docx") {
      const z = await JSZip.loadAsync(await file.arrayBuffer());
      const xml = new DOMParser().parseFromString(await z.file("word/document.xml").async("string"), "application/xml");
      const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
      const txt = el => Array.from(el.getElementsByTagNameNS(W, "t")).map(t => t.textContent).join("");
      const lineas = [];
      for (const el of Array.from(xml.getElementsByTagNameNS(W, "body")[0].children)) {
        if (el.localName === "p") lineas.push(txt(el));
        else if (el.localName === "tbl") for (const tr of Array.from(el.getElementsByTagNameNS(W, "tr"))) lineas.push("| " + Array.from(tr.getElementsByTagNameNS(W, "tc")).map(txt).join(" | ") + " |");
      }
      const md = `# ${file.name}\n\nConvertido de Word en la página (${new Date().toLocaleDateString("es-AR")}).\n\n${lineas.join("\n")}\n`;
      return { blob: new Blob([md], { type: "text/markdown" }), nombre: file.name + ".md", tipo: "text/markdown", original: file.name };
    }
    throw new Error(`${file.name}: formato no admitido (.${ext}). Guardalo como PDF, imagen, Excel o Word.`);

          const p = P.lista.find(x => x.id === b.dataset.id);
          if (p.estado === "error" && b.dataset.ok !== "1") { b.dataset.ok = "1"; b.textContent = "¿Seguro? Puede haber llegado"; return; }
          b.disabled = true; await mandarPedido(p.id, p); I.toast("Pedido mandado a Claude Code"); break;
        }
        case "borrar":
          if (b.dataset.ok !== "1") { b.dataset.ok = "1"; b.textContent = "¿Seguro? Borrar"; setTimeout(() => { b.dataset.ok = ""; b.textContent = "Borrar"; }, 4000); return; }
          await S.db.doc("pedidos/" + b.dataset.id).delete(); I.toast("Pedido borrado (los archivos subidos se conservan)"); break;
        case "prop-mandar": case "prop-guardar": {
          const pr = chat.propuesta; if (!pr) return;
          b.disabled = true; agregarTraza("Subiendo archivos y guardando el pedido…");
          const id = await crearPedido({ tipo: pr.tipo, texto: pr.texto, cot: pr.cot || "", files: chat.todosAdjuntos, mandar: b.dataset.p === "prop-mandar" }, agregarTraza);

          break;
        }
        case "nuevo-borrar":
          if (b.dataset.ok !== "1") { b.dataset.ok = "1"; b.textContent = "¿Seguro?"; setTimeout(() => { b.dataset.ok = ""; b.textContent = "Borrar"; }, 4000); return; }
          await S.db.doc("catalogo_nuevo/" + b.dataset.id).delete(); I.toast("Borrado del catálogo nuevo"); break;
        case "prop-cancelar": chat.propuesta = null; document.getElementById("ch-prop")?.remove(); break;
        case "conf-ok": case "conf-no": {
          const f = confirmaciones.get(b.dataset.id); confirmaciones.delete(b.dataset.id); document.getElementById(b.dataset.id)?.remove();

    } catch (e) { I.toast(e.message || String(e.code || e)); if (b.dataset.p.startsWith("prop")) agregarBurbuja("a", "No se pudo: " + (e.message || e.code)); }

  // ------------------------------------------------------------------ chat: imágenes (PDF → páginas como imagen)
  let pdfjs = null;
  function cargarScript(src) { return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("No se pudo cargar " + src)); document.head.append(s); }); }
  async function paginasPdf(file, max) {
    if (!pdfjs) {
      const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
      await cargarScript(base + "pdf.min.js"); await cargarScript(base + "pdf.worker.min.js");
      pdfjs = window.pdfjsLib; pdfjs.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
    }
    const doc = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise, out = [];
    for (let n = 1; n <= Math.min(doc.numPages, max); n++) {
      const pg = await doc.getPage(n), v1 = pg.getViewport({ scale: 1 }), esc_ = Math.min(3, 2000 / Math.max(v1.width, v1.height));
      const v = pg.getViewport({ scale: esc_ }), c = document.createElement("canvas"); c.width = v.width; c.height = v.height;
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      await pg.render({ canvasContext: ctx, viewport: v }).promise;
      out.push(await new Promise(ok => c.toBlob(ok, "image/png")));
    }
    return { imgs: out, total: doc.numPages };
  }
  async function imagenesDe(files, notas) {
    const max = limites?.images?.maxCount || 0, imgs = [];
    for (const f of files) {
      if (imgs.length >= max) { notas.push(`${f.name}: no entra (máximo ${max} imágenes por mensaje)`); continue; }
      if (/^image\//.test(f.type)) imgs.push(f);
      else if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) {
        const r = await paginasPdf(f, max - imgs.length); imgs.push(...r.imgs);
        if (r.total > r.imgs.length) notas.push(`${f.name}: se mandan ${r.imgs.length} de ${r.total} páginas`);
      } else notas.push(`${f.name}: el chat no lo lee (solo imágenes y PDF); sí va si lo mandás a Claude Code`);
    }
    return imgs;
  }

    return `Sos el asistente del Cotizador ITT, una página para cotizar equipos de ITT S.A. (Quilmes, Argentina; fabricante de calentadores, separadores, filtros, skids, manifolds, colectores, puentes de medición, cañerías, tanques y trampas para oil & gas). Hablás con alguien de Ventas de ITT en español rioplatense. Respuestas cortas.

Reglas obligatorias (un error que llega al cliente puede ser catastrófico):
- Todo en USD y SIN IVA. Si una fuente dice "con IVA", dividí por 1,21 (o 1,105 si es 10,5%).
- Nunca inventes un precio ni lo saques de memoria. Los precios salen del catálogo (herramientas buscar_*) o de un documento que el usuario adjuntó, con proveedor y fecha. Si no hay, cargá el ítem con precio 0 (queda SIN PRECIO para pedir cotización).

- Si no hay precio de la pieza ni de una pieza parecida, NO inventes un valor: precio 0, "SIN PRECIO: pedir cotización" (coincide "sin_ref"). Un estimado tiene que citar su referencia (pieza parecida, antecedente o tarifa × cantidad).
- Al copiar la tabla de materiales de un plano: renglón por renglón, con la posición, la misma cantidad y la misma unidad del plano. Compras extra (sobrantes, mangas) van en filas aparte (pos "14b"). No juntes renglones.
- Si una parte del plano no se lee bien, decilo y no adivines. Pedí una imagen mejor o mandá el trabajo a Claude Code.

Familias de materiales para buscar_materiales: ${fams}.
Tipos de origen de un precio: lista, cot (cotización de proveedor), stock, ant (antecedente o planilla interna), est (estimado).`;

  const ERRORES = {
    not_granted: "No diste permiso a la página para usar Claude. Se puede habilitar desde el menú de permisos de la página.",
    sampling_disabled: "Claude no está disponible para esta cuenta.", rate_limited: "Llegaste al límite de uso por ahora. Probá en un rato.",
    session_expired: "Tenés que volver a iniciar sesión en Claude.", image_rejected: "Alguna imagen no se pudo usar (formato o tamaño). Probá con otra.",
    images_unavailable: "En esta vista no se pueden mandar imágenes.", prompt_too_large: "El mensaje es muy largo. Empezá una conversación nueva o mandá menos a la vez.",
    refused: "Claude no respondió a este pedido. Probá formularlo de otra manera.", empty_completion: "No hubo respuesta. Probá de nuevo con un pedido más simple.",
  };
  async function enviar() {
    if (chat.ocupado) return;
    const ta = document.getElementById("ch-txt"), texto = ta.value.trim(), files = chat.adjuntos.slice();
    if (!texto && !files.length) return;
    chat.ocupado = true; ta.value = ""; chat.adjuntos = []; pintarAdjuntos();
    document.getElementById("ch-enviar").disabled = true; document.getElementById("ch-parar").hidden = false;
    chat.todosAdjuntos.push(...files);
    const contenido = texto + (files.length ? `\n\n[Adjuntó: ${files.map(f => f.name).join(", ")}]` : "");
    agregarBurbuja("u", contenido);
    const resp = agregarBurbuja("a", "Pensando…"); resp.classList.add("pensando"); chat.respEl = resp;
    const notas = []; let imgs = [];
    try {
      if (files.length) {
        if (!limites?.images) notas.push("en esta vista no se pueden mandar imágenes al chat");
        else imgs = await imagenesDe(files, notas);
        notas.forEach(n => agregarTraza(n));
      }
      let marcado = false;
      const marcar = () => { if (!marcado && I.S.doc) { chat.deshacer.push({ id: I.S.id, doc: I.clon(I.S.doc), hora: new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" }) }); marcado = true; } };
      const previos = chat.turnos.slice(-20);
      const ultimo = `${contexto()}\n\n${imgs.length ? `Van ${imgs.length} imagen(es) adjuntas (páginas de: ${files.map(f => f.name).join(", ")}).\n\n` : ""}Mensaje del usuario:\n${contenido}`;
      const input = [{ role: "user", content: reglas() }, ...previos, { role: "user", content: ultimo }];
      chat.turnos.push({ role: "user", content: contenido });
      chat.ctl = new AbortController();
      const ops = { signal: chat.ctl.signal, cache: false, modelTier: imgs.length ? "complex" : "default",
        onText: ({ text }) => { resp.classList.remove("pensando"); resp.innerHTML = md(text); document.getElementById("ch-msgs").scrollTop = 1e9; } };
      if (imgs.length) ops.images = imgs;
      if (limites?.tools) { ops.tools = herramientas(marcar).slice(0, limites.tools.maxCount || 20); delete ops.cache; }
      const r = await sample(input, ops);
      resp.classList.remove("pensando"); resp.innerHTML = md(r.text) + (r.truncated ? '<div class="small muted">(respuesta cortada: pedí menos a la vez)</div>' : "");
      chat.turnos.push({ role: "assistant", content: r.text });
    } catch (e) {
      resp.classList.remove("pensando");
      if (e.code === "cancelled") resp.innerHTML = e.text ? md(e.text) + '<div class="small muted">(detenido)</div>' : '<span class="muted">Detenido.</span>';
      else resp.innerHTML = (e.text ? md(e.text) + "<br>" : "") + `<span class="err">${esc(ERRORES[e.code] || "Hubo un problema de conexión con Claude. Probá de nuevo.")}</span>`;
      if (e.text) chat.turnos.push({ role: "assistant", content: e.text });
    } finally {
      chat.ocupado = false; chat.ctl = null; chat.respEl = null;
      document.getElementById("ch-enviar").disabled = false; document.getElementById("ch-parar").hidden = true; pintarContexto();
    }
  }

  return { renderPedidos, abrirChat, TIPOS_PEDIDO, prepararArchivo, crearPedido };
})();
if (typeof module !== "undefined") module.exports = Asistente;

</script>
